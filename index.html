/* --- Gericht schätzen (Claude) --- */
const REST_FAT=10; // Zuschlag Kochfett in g für Restaurantessen (Foto-/Text-Schätzungen unterschätzen Fett typischerweise)
function dishTotals(r, rest){
  const t={kcal:0,protein:0,carbs:0,fat:0};
  (r.components||[]).forEach(c=>MACROS.forEach(([k])=>t[k]+=num(c[k])||0));
  if(rest){ t.fat+=REST_FAT; t.kcal+=REST_FAT*9; }
  return t;
}
function viewDish(A){
  if(!S.sample) return '<div class="small muted">Gerichte schätzt Claude in der Schätz-App.</div><button class="btn primary block" style="margin-top:10px" data-action="nut-estimate">'+I('utensils')+' Gericht in Claude schätzen</button>';
  if(false) return '<div class="small muted">Das Schätzen mit Claude ist in dieser Ansicht nicht verfügbar. Öffne die App über deinen Claude-Link – oder nutze «Manuell».</div>';
  if(A.busy) return '<div class="last">Claude schätzt das Gericht … das dauert meist 10–60 Sekunden.</div><button class="btn block" style="margin-top:8px" data-action="nut-est-stop">Abbrechen</button>';
  if(A.result){
    const r=A.result, t=dishTotals(r, A.rest!==false);
    let h='<table class="comp">'+(r.components||[]).map(c=>'<tr><td>'+esc(c.name)+'<span class="muted"> · '+r0(c.grams)+' g</span></td><td class="r"><b>P '+r0(c.protein)+'</b> · '+r0(c.kcal)+' kcal</td></tr>').join('')+
      (A.rest!==false?'<tr><td>Zuschlag Kochfett (Restaurant)<span class="muted"> · '+REST_FAT+' g Fett</span></td><td class="r">'+REST_FAT*9+' kcal</td></tr>':'')+'</table>';
    if(r.notes||r.confidence) h+='<div class="small muted" style="margin-top:6px">'+(r.confidence?'Sicherheit: '+esc(r.confidence)+'. ':'')+esc(r.notes||'')+'</div>';
    h+='<label class="row small" style="margin-top:8px"><input type="checkbox" data-f="dishrest" '+(A.rest!==false?'checked':'')+'> Restaurant / Take-away (+'+REST_FAT+' g Kochfett)</label>';
    if(A.auto) h+='<div class="small muted" style="margin-top:4px">Nur aus dem Foto geschätzt. Genauer wird es mit kurzer Beschreibung: «Neu schätzen».</div>';
    h+='<form id="dishForm" style="margin-top:10px"><div class="field"><label>Name</label><input name="name" value="'+esc(r.name||A.desc||'Gericht')+'"></div><div class="grid2">'+
      [['protein','Protein (g)'],['kcal','Kalorien (kcal)'],['carbs','Kohlenhydrate (g)'],['fat','Fett (g)']].map(([k,l])=>'<div class="field"><label>'+l+'</label><input name="'+k+'" inputmode="decimal" value="'+r0(t[k])+'"></div>').join('')+
      '</div><label class="small row" style="margin:0 0 10px"><input type="checkbox" name="save"> Als «Mein Gericht» speichern (für nächstes Mal)</label>'+
      '<button class="btn primary block">Hinzufügen</button></form><button class="btn block" style="margin-top:8px" data-action="nut-est-again">Neu schätzen</button>';
    return h;
  }
  return '<div class="field"><label>Was hast du gegessen?</label><textarea class="note" data-f="dishdesc" placeholder="z. B. Zürcher Geschnetzeltes mit Rösti, Rahmsauce, Beilagensalat">'+esc(A.desc||'')+'</textarea></div>'+
    '<div class="grid2"><div class="field"><label>Portion</label><select data-f="dishportion">'+['klein','normal','gross','sehr gross'].map(p=>'<option '+((A.portion||'normal')===p?'selected':'')+'>'+p+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>Herkunft</label><label class="row small" style="padding:10px 0"><input type="checkbox" data-f="dishrest" '+(A.rest!==false?'checked':'')+'> Restaurant / Take-away</label></div></div>'+
    (S.sampleImages?'<div style="margin-bottom:10px">'+photoPicker('dish','dish-photo',A.photo?'Foto gewählt – ändern':'Foto vom Teller (optional)','')+'</div>':'')+
    '<button class="btn primary block" data-action="nut-estimate">Schätzen lassen</button>'+
    '<p class="small muted" style="margin:8px 0 0">Tipp: Beschreibung schlägt Foto – Saucen, Rahm und Öl sieht man auf Fotos kaum. Die Werte kannst du vor dem Speichern anpassen.</p>';
}
async function estimateDish(){
  const A=S.nutAdd; if(!A||!S.sample) return;
  const desc=(A.desc||'').trim();
  if(!desc && !A.photo){ A.msg='Bitte kurz beschreiben, was du gegessen hast.'; render(); return; }
  A.msg=''; A.busy=true; render();
  const ctl=new AbortController(); S._estCtl=ctl;
  const rest=A.rest!==false, portion=A.portion||'normal';
  const prompt='Du bist Ernährungsberater in der Schweiz. Schätze die Nährwerte dieses Gerichts'+(rest?' aus einem Restaurant oder Take-away':'')+'.\n'+
    'Beschreibung der Person: "'+(desc||'(keine, nur Foto)')+'"\nPortionsgrösse laut Person: '+portion+'.\n'+
    (A.photo?'Ein Foto des Tellers ist beigefügt: nutze es für Bestandteile und Portionsgrösse, die Beschreibung hat aber Vorrang.\n':'')+
    'Regeln:\n- Zerlege das Gericht in Bestandteile mit Gramm-Angaben.\n- Verwende Werte aus Standard-Nährwerttabellen (z. B. Schweizer Nährwertdatenbank).\n'+
    '- Rechne verstecktes Fett (Bratöl, Butter, Rahm in Saucen, Dressing) als eigene Bestandteile ein, realistisch für '+(rest?'Restaurantküche':'Hausmannskost')+'.\n'+
    '- Bei Unklarheit typische Schweizer Portionen annehmen. Protein nicht überschätzen.\n'+
    'Antworte nur mit JSON in genau dieser Form:\n{"name":"kurzer Name","components":[{"name":"Bestandteil","grams":0,"kcal":0,"protein":0,"carbs":0,"fat":0}],"confidence":"niedrig|mittel|hoch","notes":"ein kurzer Satz, was unsicher ist"}';
  try{
    const opts={signal:ctl.signal, cache:false, modelTier:'default'};
    if(A.photo && S.sampleImages) opts.images=[A.photo];
    const r=await S.sample.json(prompt, opts);
    if(!r || !Array.isArray(r.components) || !r.components.length) throw {code:'invalid_json'};
    r.components=r.components.map(c=>({name:String(c.name||'Bestandteil'), grams:num(c.grams)||0, kcal:num(c.kcal)||0, protein:num(c.protein)||0, carbs:num(c.carbs)||0, fat:num(c.fat)||0}));
    A.result={name:String(r.name||desc||'Gericht'), components:r.components, confidence:String(r.confidence||''), notes:String(r.notes||'')};
  }catch(e){
    const c=e&&e.code;
    const m={not_granted:'Du hast der App nicht erlaubt, Claude zu nutzen. Ohne Erlaubnis kann ich nicht schätzen – nutze «Manuell».',
      sampling_disabled:'Claude ist für dieses Konto hier nicht verfügbar.', rate_limited:'Gerade zu viele Anfragen – bitte später nochmals versuchen.',
      image_rejected:'Das Foto konnte nicht verwendet werden. Versuch es ohne Foto.', images_unavailable:'Fotos sind hier nicht möglich – versuch es nur mit Beschreibung.',
      invalid_json:'Die Antwort war unvollständig – bitte nochmals versuchen.', session_expired:'Bitte in Claude neu anmelden.'};
    if(c!=='cancelled') A.msg=m[c]||'Schätzen hat nicht geklappt – bitte nochmals versuchen.';
  }finally{ A.busy=false; S._estCtl=null; render(); }
}

function openProduct(code){
  const base={...(S.nutAdd||{meal:defaultMeal()})};
  if(S.products[code]){ S.nutAdd={...base, mode:'product', code, grams:S.products[code].serving||'', msg:''}; render(); return; }
  S.nutAdd={...base, mode:'off', code, msg:''}; render();
  lookupOFF(code).then(p=>{
    if(!S.nutAdd||S.nutAdd.code!==code) return;
    if(p){ S.products[code]=p; dbWrite(()=>S.db.doc('products/'+code).set(p)); if(S.pending[code]) dbWrite(()=>S.db.doc('pending/'+code).delete()); }
    S.nutAdd={...S.nutAdd, mode:'product', grams:(p&&p.serving)||'', msg:p?'':(navigator.onLine?'':'Offline – Open Food Facts nicht erreichbar.')}; render();
  });
}
/* Open Food Facts direkt abfragen (Daten: ODbL) */
async function lookupOFF(code){
  for(const host of ['world','ch']){
    try{
      const r=await fetch('https://'+host+'.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,product_name_de,brands,nutriments,serving_quantity');
      if(!r.ok) continue; const j=await r.json(); const p=j&&j.product; if(!p||j.status===0) continue;
      const n=p.nutriments||{}, kcal=n['energy-kcal_100g']??(n['energy_100g']!=null?n['energy_100g']/4.184:null);
      if(kcal==null||n.proteins_100g==null) continue;
      return {barcode:code, name:p.product_name_de||p.product_name||'Produkt', brand:(p.brands||'').split(',')[0].trim(), per100:{kcal:Math.round(kcal), protein:+n.proteins_100g||0, carbs:+(n.carbohydrates_100g||0), fat:+(n.fat_100g||0)}, serving:+p.serving_quantity||null, source:'Open Food Facts', updatedAt:new Date().toISOString()};
    }catch(e){}
  }
  return null;
}

  window.open(ESTIMATOR_URL, '_blank');
}
function handleHash(){
  const h=location.hash.slice(1); if(!h) return;
  const q=new URLSearchParams(h);
  if(q.get('setup')){
    history.replaceState(null,'',location.pathname);
    GT.connect(q.get('setup'), q.get('t')||'').then(()=>toast('Mit Google verbunden')).catch(e=>{ renderBanner('Verbindung fehlgeschlagen: '+esc(e.message||e)+'. Prüfe den Einrichtungslink.'); });
  }
  if(q.get('add')){
    history.replaceState(null,'',location.pathname);
    let P=null; try{ P=JSON.parse(q.get('add')); }catch(e){}
    if(!P){ toast('Übernahme fehlgeschlagen'); return; }
    let aw=null; try{ aw=JSON.parse(localStorage.getItem('gt-await')||'null'); }catch(e){}
    if(aw && Date.now()-aw.at>3600000) aw=null;
    S.view='ernaehrung'; S.nutDate=today();
    S.nutAdd={mode:'import', meal:P.meal||(aw&&aw.meal)||defaultMeal(), imp:P, code:(P.per100&&((aw&&aw.code)||(P.code&&validCode(P.code)&&P.code)))||null, grams:null};
    render(); window.scrollTo(0,0);
  }
}

/* --- Ereignisse --- */
function nutClick(b,act){
  switch(act){
    case 'nut-prev': S.nutDate=shiftDate(S.nutDate,-1); S.nutAdd=null; S.moveItem=null; S.copyMeal=null; render(); break;
    case 'nut-next': if(S.nutDate<shiftDate(today(),NUT_AHEAD)){ S.nutDate=shiftDate(S.nutDate,1); S.nutAdd=null; S.copyMeal=null; S.moveItem=null; render(); } break;
    case 'nut-today': S.nutDate=today(); S.nutAdd=null; S.copyMeal=null; render(); break;
    case 'nut-move': { const it=dayItems(S.nutDate).find(i=>i.id===b.dataset.id); S.moveItem=(S.moveItem&&S.moveItem.id===b.dataset.id)?null:(it?{id:it.id, meal:it.meal, date:S.nutDate}:null); render(); break; }
    case 'nut-move-meal': if(S.moveItem){ S.moveItem.meal=b.dataset.v; render(); } break;
    case 'nut-move-day': if(S.moveItem){ S.moveItem.date=b.dataset.v; render(); } break;
    case 'nut-move-cancel': S.moveItem=null; render(); break;
    case 'nut-move-go': { const M=S.moveItem, from=S.nutDate, it=dayItems(from).find(i=>i.id===M.id); S.moveItem=null; if(!it) break;
      (async()=>{
        if(M.date===from){ await saveDay(from, d=>{ const x=d.items.find(i=>i.id===M.id); if(x) x.meal=M.meal; }); }
        else { await saveDay(M.date, d=>{ d.items.push({...it, meal:M.meal}); }); await saveDay(from, d=>{ d.items=d.items.filter(i=>i.id!==M.id); }); }
        toast('Verschoben nach '+M.meal+(M.date!==from?', '+fmtDate(M.date):''));
      })(); render(); break; }
    case 'nut-copy': S.copyMeal={meal:b.dataset.meal, days:[]}; render(); break;
    case 'nut-copy-day': { const c=S.copyMeal; if(c){ const d=b.dataset.d; c.days=c.days.includes(d)?c.days.filter(x=>x!==d):[...c.days,d]; render(); } break; }
    case 'nut-copy-cancel': S.copyMeal=null; render(); break;
    case 'nut-copy-go': { const c=S.copyMeal, src=dayItems(S.nutDate).filter(i=>i.meal===c.meal); S.copyMeal=null; render();
      (async()=>{ for(const d of c.days){ await saveDay(d, day=>{ src.forEach(it=>{ const {id,addedAt,...rest}=it; day.items.push({...rest, id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), addedAt:new Date().toISOString()}); }); }); } toast(c.meal+' auf '+c.days.length+' Tag(e) kopiert'); })(); break; }
    case 'nut-mode': S.nutAdd={mode:b.dataset.mode, meal:(S.nutAdd&&S.nutAdd.meal)||defaultMeal()}; render(); break;
    case 'nut-close': S.nutAdd=null; S.picker=null; render(); break;
    case 'nut-recheck': { b.disabled=true; b.textContent='Suche …'; (async()=>{ let ok=0; const codes=Object.keys(S.pending);
        for(const code of codes){ const p=await lookupOFF(code); if(p){ S.products[code]=p; await dbWrite(()=>S.db.doc('products/'+code).set(p)); await dbWrite(()=>S.db.doc('pending/'+code).delete()); ok++; } else await dbWrite(()=>S.db.doc('pending/'+code).update({status:'nicht gefunden', checked:today()})); }
        toast(ok?ok+' von '+codes.length+' gefunden und eingetragen':'Keiner der '+codes.length+' Barcodes ist bei Open Food Facts'); render(); })(); break; }
    case 'nut-openpend': S.nutAdd={meal:defaultMeal()}; openProduct(b.dataset.code); window.scrollTo(0,0); break;
    case 'nut-estimate': openEstimator(b.dataset.code||null); break;
    case 'nut-pickphoto': S.picker=b.dataset.k; render(); break;
    case 'nut-meal': S.nutAdd.meal=b.dataset.m; render(); break;
    case 'nut-pick': openProduct(b.dataset.code); break;
    case 'nut-serv': S.nutAdd.grams=b.dataset.g; render(); break;
    case 'nut-del': S.confirm='nutdel:'+b.dataset.id; render(); break;
    case 'nut-fill': { const d=(S._fillSug||[])[+b.dataset.i]; if(d){ addItem({meal:d.meal, name:d.n, est:true, kcal:d.k, protein:d.p, carbs:d.c, fat:d.f}).then(()=>toast(d.n+' bei '+d.meal+' eingetragen')); } break; }
    case 'nut-psuggest': { const v=+b.dataset.g; dbWrite(()=>S.db.doc('settings/nutrition').set({...(S.nutGoals||{}), protein:v})).then(ok=>ok&&toast('Proteinziel: '+v+' g')); break; }
    case 'nut-delask': S.confirmDel=b.dataset.kind+':'+b.dataset.id; render(); clearTimeout(S.confirmT); S.confirmT=setTimeout(()=>{ S.confirmDel=null; render(); },4000); break;
    case 'nut-owndel': S.confirmDel=null; deleteOwn(b.dataset.kind,b.dataset.id); break;
    case 'nut-dish-add': { const d=(S.dishes||[]).find(x=>x.id===b.dataset.id); if(d){ const it={meal:(S.nutAdd&&S.nutAdd.meal)||defaultMeal(), name:d.name, est:true}; MACROS.forEach(([k])=>it[k]=d[k]||0); addItem(it).then(()=>{ S.nutAdd=null; render(); toast('Hinzugefügt'); }); } break; }
    case 'nut-estimate': estimateDish(); break;
    case 'nut-est-stop': if(S._estCtl) S._estCtl.abort(); break;
    case 'nut-est-again': S.nutAdd.result=null; S.nutAdd.auto=false; render(); break;
    case 'nut-del-yes': { const id=b.dataset.id; S.confirm=null; saveDay(S.nutDate, d=>{ d.items=d.items.filter(i=>i.id!==id); }); break; }
  }
}
async function readLabel(file, code, fromScan){
  const A=S.nutAdd; A.mode='label'; A.busy=true; A.msg=''; A.code=code||null; render();
  const prompt='Bestimme zuerst, was auf dem Bild ist: "label" = Nährwerttabelle/Verpackung mit lesbaren Nährwerten; "dish" = ein Gericht, Teller, Snack oder Lebensmittel ohne lesbare Nährwerttabelle; "other" = nichts davon.\n'+
    (fromScan?'':'Erwartet wird eine Nährwerttabelle.\n')+
    'Bei "label" lies die Werte ab.\n'+
    'Regeln:\n- Gib Werte PRO 100 g bzw. 100 ml an. Steht nur pro Portion da, rechne mit der Portionsgrösse auf 100 g um.\n'+
    '- kcal: Energie in kcal (falls nur kJ: kJ/4.184).\n- carbs = Kohlenhydrate gesamt (nicht nur Zucker), fat = Fett gesamt.\n'+
    '- Nur ablesen, nichts schätzen. Ist keine Nährwerttabelle lesbar, setze found auf false.\n'+
    '- serving: Portionsgrösse in g, falls angegeben, sonst null. barcode: Ziffern eines sichtbaren EAN-Codes, sonst "".\n'+
    'Antworte nur mit JSON: {"type":"label|dish|other","found":true,"name":"Produktname falls sichtbar","brand":"","per100":{"kcal":0,"protein":0,"carbs":0,"fat":0},"serving":null,"barcode":""}. Bei "dish" oder "other": found=false und per100 leer lassen.';
  try{
    const r=await S.sample.json(prompt,{images:[file], cache:false, modelTier:'default'});
    if(fromScan && r && r.type==='dish'){ A.mode='dish'; A.photo=file; A.desc=''; A.result=null; A.busy=false; A.auto=true; setTimeout(estimateDish,0); return true; }
    if(!r || !r.found || !r.per100 || num(r.per100.kcal)==null) throw {code:'nolabel'};
    const bc=String(r.barcode||'').replace(/\D/g,'');
    if(!A.code && validCode(bc)) A.code=bc;
    A.label={name:String(r.name||''), brand:String(r.brand||''), per100:{kcal:num(r.per100.kcal), protein:num(r.per100.protein)||0, carbs:num(r.per100.carbs)||0, fat:num(r.per100.fat)||0}, serving:num(r.serving)||null};
    A.grams=A.label.serving||'';
    return true;
  }catch(e){
    const c=e&&e.code;
    if(c==='nolabel'){ A.mode=fromScan?'code':'product'; A.msg=fromScan?'Weder Barcode, Nährwerttabelle noch Gericht erkannt. Tipp: Barcode quer und formatfüllend oder die Tabelle gerade und scharf fotografieren. Oder Zahlen eintippen.':'Auf dem Foto war keine Nährwerttabelle lesbar – bitte gerade und scharf fotografieren.'; }
    else { A.mode=fromScan?'code':'product'; A.msg={not_granted:'Ohne Erlaubnis für Claude kann die App keine Nährwerttabellen lesen.', rate_limited:'Gerade zu viele Anfragen – bitte später nochmals.', image_rejected:'Das Bild konnte nicht verwendet werden.'}[c]||'Lesen hat nicht geklappt – bitte nochmals versuchen.'; }
    return !fromScan;
  }finally{ if(A.mode!=='dish') A.busy=false; render(); }
}
async function nutPhoto(input){
  const f=input.files&&input.files[0]; if(!f) return;
  S.nutAdd={mode:'code', meal:(S.nutAdd&&S.nutAdd.meal)||defaultMeal(), msg:'Bild wird gelesen …'}; render();
  let r={why:'error'}; try{ r=await decodeBarcode(f); }catch(e){ r={why:'error', detail:String(e&&e.message||e)}; }
  input.value='';
  if(r.code && validCode(r.code)) { openProduct(r.code); return; }
  // kein Barcode → Nährwerttabelle lesen
  if(r.why==='notfound'){ S.nutAdd.mode='code'; S.nutAdd.msg=''; S.nutAdd.noCode=true; render(); return; }
  const msgs={
    image:'Das Foto konnte nicht geöffnet werden (Fehler A). Versuch es nochmals oder tippe die Zahlen ein.',
    lib:'Die Barcode-Erkennung konnte nicht geladen werden (Fehler B). Prüfe die Internetverbindung oder tippe die Zahlen ein.',
    notfound:'Im Foto wurde kein Barcode gefunden (Fehler C). Tipp: Barcode quer, formatfüllend und scharf fotografieren, ohne Spiegelung. Oder Zahlen eintippen.',
    error:'Unerwarteter Fehler beim Lesen (Fehler D'+(r.detail?': '+r.detail:'')+').'
  };
  S.nutAdd.mode='code'; S.nutAdd.msg=(r.code?'Gelesen: '+r.code+' – ungültig. ':'')+(msgs[r.why]||msgs.error); render();
}
async function nutSubmit(form){
  const A=S.nutAdd, f=new FormData(form);
  if(form.id==='goalForm'){ const g={}; MACROS.forEach(([k])=>{ const v=num(f.get(k)); if(v!=null) g[k]=v; }); if(await dbWrite(()=>S.db.doc('settings/nutrition').set(g))) toast('Ziele gespeichert'); return; }
  if(!A) return;
  if(form.id==='codeForm'){ const c=String(f.get('code')||'').replace(/\D/g,''); if(!validCode(c)){ A.msg='Bitte 8 bis 14 Ziffern eingeben.'; A.code=c; render(); return; } openProduct(c); return; }
  if(form.id==='prodForm'){ const g=num(f.get('grams')); if(!g){ A.msg='Bitte Menge in Gramm eingeben.'; render(); return; }
    const p=S.products[A.code]; await addItem({meal:A.meal, barcode:A.code, name:p?p.name:'', grams:g}); S.nutAdd=null; render(); toast('Hinzugefügt'); return; }
  if(form.id==='pendForm'){ const g=num(f.get('grams')); if(!g){ A.msg='Bitte Menge in Gramm eingeben.'; render(); return; }
    const label=String(f.get('label')||'').trim();
    await ensurePending(A.code,label);
    if(label && S.pending[A.code] && !S.pending[A.code].label) await dbWrite(()=>S.db.doc('pending/'+A.code).update({label}));
    await addItem({meal:A.meal, barcode:A.code, name:label, grams:g}); S.nutAdd=null; render(); toast('Erfasst – Nährwerte fehlen noch'); return; }
  if(form.id==='impForm'){
    const P=A.imp||{};
    if(P.per100){
      const g=num(f.get('grams')); if(!g){ A.msg='Bitte die gegessene Menge in Gramm eingeben.'; render(); return; }
      const id=A.code||('eigen-'+Date.now().toString(36));
      const prod={barcode:id, name:P.n||'Produkt', brand:P.brand||'', per100:{kcal:+P.per100.kcal||0, protein:+P.per100.protein||0, carbs:+P.per100.carbs||0, fat:+P.per100.fat||0}, serving:+P.serving||null, source:'Foto Nährwerttabelle', updatedAt:new Date().toISOString()};
      if(!await dbWrite(()=>S.db.doc('products/'+id).set(prod))) return;
      S.products[id]=prod; if(A.code && S.pending[A.code]) await dbWrite(()=>S.db.doc('pending/'+A.code).delete());
      await addItem({meal:A.meal, barcode:id, name:prod.name, grams:g});
    } else {
      const it={meal:A.meal, name:P.n||'Gericht', est:true, kcal:+P.k||0, protein:+P.p||0, carbs:+P.c||0, fat:+P.f||0};
      await addItem(it);
      if(f.get('save')) await dbWrite(()=>S.db.collection('dishes').doc().set({name:it.name, kcal:it.kcal, protein:it.protein, carbs:it.carbs, fat:it.fat}));
    }
    try{ localStorage.removeItem('gt-await'); }catch(e){}
    S.nutAdd=null; render(); toast('Hinzugefügt'); return; }
  if(form.id==='labelForm'){
    const per100={}; for(const [k] of MACROS){ const v=num(f.get(k)); if(v==null){ A.msg='Bitte alle vier Werte pro 100 g ausfüllen.'; render(); return; } per100[k]=v; }
    const g=num(f.get('grams')); if(!g){ A.msg='Bitte die gegessene Menge in Gramm eingeben.'; render(); return; }
    const id=A.code||('eigen-'+Date.now().toString(36)), name=String(f.get('name')||'').trim()||'Produkt';
    const prod={barcode:id, name, brand:String(f.get('brand')||'').trim(), per100, serving:num(f.get('serving'))||null, source:'Foto Nährwerttabelle', updatedAt:new Date().toISOString()};
    if(!await dbWrite(()=>S.db.doc('products/'+id).set(prod))) return;
    S.products[id]=prod;
    if(A.code && S.pending[A.code]) await dbWrite(()=>S.db.doc('pending/'+A.code).delete());
    await addItem({meal:A.meal, barcode:id, name, grams:g}); S.nutAdd=null; render(); toast('Hinzugefügt & gespeichert'); return; }
  if(form.id==='dishForm'){ const it={meal:A.meal, name:String(f.get('name')||'').trim()||'Gericht', est:true}; let any=false;
    MACROS.forEach(([k])=>{ const v=num(f.get(k)); if(v!=null){ it[k]=v; any=true; } });
    if(!any){ A.msg='Bitte Werte eintragen.'; render(); return; }
    await addItem(it);
    if(f.get('save')){ const d={name:it.name}; MACROS.forEach(([k])=>d[k]=it[k]||0); await dbWrite(()=>S.db.collection('dishes').doc().set(d)); }
    S.nutAdd=null; render(); toast(f.get('save')?'Hinzugefügt & als Gericht gespeichert':'Hinzugefügt'); return; }
  if(form.id==='manForm'){ const it={meal:A.meal, name:String(f.get('name')||'').trim()||'Eintrag'}; const g=num(f.get('grams')); if(g) it.grams=g;
    let any=false; MACROS.forEach(([k])=>{ const v=num(f.get(k)); if(v!=null){ it[k]=v; any=true; } });
    if(!any){ A.msg='Bitte mindestens Kalorien oder Protein eintragen.'; render(); return; }
    await addItem(it); S.nutAdd=null; render(); toast('Hinzugefügt'); return; }
}
document.addEventListener('change', ev=>{
  const el=ev.target;
  if(/^(nut|label|dish)-photo$/.test(el.dataset.action||'')) S.picker=null;
  if(el.dataset.action==='nut-photo') nutPhoto(el);
  if(el.dataset.action==='label-photo' && S.nutAdd){ const f=el.files&&el.files[0]; el.value=''; if(f) readLabel(f, S.nutAdd.code, false); }
  if(el.dataset.action==='dish-photo' && S.nutAdd){ S.nutAdd.photo=el.files&&el.files[0]||null; render(); }
  if(el.dataset.f==='dishportion' && S.nutAdd){ S.nutAdd.portion=el.value; }
  if(el.dataset.f==='dishrest' && S.nutAdd){ S.nutAdd.rest=el.checked; if(S.nutAdd.result) render(); }
});
document.addEventListener('input', ev=>{
  const el=ev.target; if(!S.nutAdd) return;
  if(el.dataset.f==='nutq'){ S.nutAdd.q=el.value; const pos=el.selectionStart; render(); const n=document.querySelector('[data-f=nutq]'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } }
  if(el.dataset.f==='dishdesc'){ S.nutAdd.desc=el.value; return; }
  if(el.dataset.f==='movedate' && S.moveItem && el.value){ S.moveItem.date=el.value; softRender(); }
  if(el.dataset.f==='impgrams' && S.nutAdd){ S.nutAdd.grams=el.value; softRender(); }
  if(el.dataset.f==='nutgrams'){ S.nutAdd.grams=el.value; const m=itemMacros({barcode:S.nutAdd.code,grams:num(el.value)||0}); const pv=document.getElementById('nutPreview'); if(pv&&m) pv.textContent=r0(m.kcal)+' kcal · P '+r0(m.protein)+' g · KH '+r0(m.carbs)+' g · F '+r0(m.fat)+' g'; }
});
if(S.db) nutInit(S.db);
function loadZXing(){
  if(window.ZXing) return Promise.resolve();
  if(!loadZXing.p) loadZXing.p=new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; sc.onload=res; sc.onerror=()=>{ loadZXing.p=null; rej(new Error('nolib')); }; document.head.appendChild(sc); });
  return loadZXing.p;
}
document.addEventListener('submit', ev=>{ if(['goalForm','codeForm','prodForm','pendForm','manForm','dishForm','labelForm','impForm'].includes(ev.target.id)){ ev.preventDefault(); nutSubmit(ev.target); } });
