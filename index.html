<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym Tracker</title>
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f6f6f4; --card:#ffffff; --text:#1d1d1b; --muted:#6b6b66; --line:#e3e2dc;
  --accent:#2f6fde; --accent-soft:#e6eefc; --ok:#1f8a4c; --ok-soft:#e3f4ea;
  --warn:#b45309; --warn-soft:#fdf0dc; --danger:#c0392b; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141413; --card:#1f1f1d; --text:#f1f0ea; --muted:#a3a29b; --line:#33322f;
    --accent:#7aa5ff; --accent-soft:#1f2a40; --ok:#4cc27e; --ok-soft:#173326;
    --warn:#f0a94b; --warn-soft:#3a2a12; --danger:#ff7b6b; }
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px 140px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 10px}
header h1{font-size:20px;margin:0;font-weight:700}
.status{font-size:12px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button .ico{font-size:20px;line-height:1;display:flex;justify-content:center}
nav.tabs button.on{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 12px}
.card h2{font-size:17px;margin:0 0 8px}
.card h3{font-size:15px;margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;border-radius:9px;padding:9px 6px;background:none;cursor:pointer;font-size:14px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.days{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.day{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.day.sug{border-color:var(--accent);background:var(--accent-soft)}
.day b{display:block;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);
  background:var(--card);border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{padding:7px 10px;font-size:14px;border-radius:10px}
.row{display:flex;gap:8px;align-items:center}
.row.rwrap{flex-wrap:wrap}
.spacer{flex:1}
.ex{padding:12px 12px 10px}
.ex.ss{border-left:4px solid var(--accent)}
.ex .top{display:flex;gap:8px;align-items:flex-start}
.badge{display:inline-block;white-space:nowrap;font-size:12px;font-weight:700;border-radius:8px;padding:2px 7px;background:var(--bg);border:1px solid var(--line)}
.badge.ss{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.target{font-size:13px;color:var(--muted);margin-top:2px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.last{font-size:13px;margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--bg)}
.up{background:var(--ok-soft);color:var(--ok);font-weight:600}
table.sets{width:100%;border-collapse:collapse;margin-top:8px}
table.sets th{font-size:12px;color:var(--muted);font-weight:500;text-align:center;padding:2px}
table.sets td{padding:3px;text-align:center}
table.sets td.n{width:28px;color:var(--muted);font-size:14px}
.in{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 6px;
  text-align:center;font-size:17px}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--card)}
.chk{width:46px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:20px}
tr.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
tr.done .in{background:var(--ok-soft);border-color:transparent}
.timer{position:fixed;left:12px;right:12px;bottom:74px;z-index:30;max-width:616px;margin:0 auto;
  background:var(--text);color:var(--bg);border-radius:16px;padding:10px 14px;display:none;align-items:center;gap:10px;
  box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer.show{display:flex}
.timer .t{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px}
.timer .lbl{font-size:13px;opacity:.8;flex:1}
.timer button{border:0;border-radius:10px;padding:8px 10px;background:rgba(127,127,127,.3);color:inherit;cursor:pointer;font-weight:600}
.timer.over{background:var(--ok);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field input,.field select,.field textarea{width:100%;min-width:0;max-width:100%}
.field input[type=date]{-webkit-appearance:none;appearance:none;min-height:44px}
.list .item{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
details.wk{border-top:1px solid var(--line);padding:10px 0}
details.wk:first-of-type{border-top:0}
details.wk summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
details.wk summary::-webkit-details-marker{display:none}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block}
.empty{padding:20px;text-align:center;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.confirm{background:var(--warn-soft);border-radius:10px;padding:10px;margin-top:8px}
.note{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;min-height:60px}
.elapsed{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:4px}
.ex.skipped{opacity:.65}
.mbar{margin-bottom:8px}
.track{height:8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin-top:3px}
.fill{height:100%;background:var(--accent);border-radius:6px}
.fill.over{background:var(--warn)}
label.btn{text-align:center}
.protein-hero{margin-top:12px}
.pbig{font-size:34px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.pbig span{font-size:16px;font-weight:600;color:var(--muted)}
.track.big{height:14px;border-radius:8px;margin-top:6px}
.mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.mini3>div{background:var(--bg);border-radius:10px;padding:8px}
.mini3 b{display:block;font-size:17px}
.mini3 span{display:block;font-size:12px;color:var(--muted)}
.comp{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.comp td{padding:4px 2px;border-top:1px solid var(--line)}
.comp td.r{text-align:right;white-space:nowrap}
.cyc{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.cyc span{display:block;font-size:13px;margin-top:2px}
.cyc.deload{background:var(--warn-soft);color:var(--warn)}
.card.rec{border-color:var(--accent)}
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.wk16{border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px;background:var(--bg)}
.wk16 b{display:block;font-size:13px}
.wk16 .dots{letter-spacing:1px;font-size:11px}
.wk16.full{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.wk16.part{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.wk16.cur{outline:2px solid var(--accent)}
.wk16.fut{opacity:.5}
.wk16 .ph{font-size:10px;color:var(--muted)}
.wnav{display:flex;align-items:center;gap:8px}
.wnav>div{flex:1;text-align:center;min-width:0}
.wnav b{display:block;font-size:14px}
.wnav span{display:block;font-size:12px;color:var(--muted)}
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.wd{background:var(--bg);border-radius:8px;padding:5px 2px;text-align:center;font-size:11px;color:var(--muted);min-width:0}
.wd span{display:block;font-weight:600}
.wd b{display:block;font-size:14px;line-height:1.3}
.wd small{display:block;font-size:9.5px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wd.done{background:var(--ok-soft);color:var(--ok)}
.wd.train{background:var(--accent-soft);color:var(--accent)}
.wd.today{outline:2px solid var(--accent)}
.wd.past.rest{opacity:.6}
.ex.exdone{background:var(--ok-soft);border-color:transparent;padding:10px 12px}
.ex.exdone h3{color:var(--ok)}
.ex.exdone .target{color:var(--ok);opacity:.85}
.badge.okb{background:var(--ok);color:#fff;border-color:transparent}
.reco{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.reco b{font-size:16px}
.reco span{display:block;font-size:12px;opacity:.85;margin-top:2px}
.reco.up{background:var(--ok-soft);color:var(--ok)}
.reco.none{background:var(--bg);color:var(--muted);font-size:13px}
.tech{margin-top:8px;font-size:14px}
.tech b{font-size:13px}
.tech ul{margin:2px 0 0;padding-left:18px}
.tech.knee{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 8px}
.segopt{flex:1;display:flex;position:relative}
.segopt input{position:absolute;opacity:0;pointer-events:none;left:0;top:0;width:1px;height:1px;margin:0}
.segopt span{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:13px;cursor:pointer}
.segopt input:checked+span{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico .ic{width:22px;height:22px;stroke-width:1.8}
.btn.danger{background:#d93025;color:#fff;border-color:#d93025}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted,#888);padding:4px 6px}
.sec{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#888);margin:22px 4px 8px}
.card.meal{padding:0;overflow:hidden}
.meal-h{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--accent-soft)}
.meal-ic{width:36px;height:36px;border-radius:50%;background:var(--card);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.meal-ic .ic{width:20px;height:20px}
.meal-t{font-size:16px;font-weight:700}
.meal-p{text-align:right;line-height:1.1}.meal-p b{display:block;font-size:18px}.meal-p span{font-size:11px;color:var(--muted,#888)}
.meal-list{padding:0 16px}
.mi{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line)}
.mi:first-child{border-top:0}
.mi-main{flex:1;min-width:0}
.mi-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi-sub{font-size:12.5px;color:var(--muted,#888);margin-top:2px}
.pill{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;padding:4px 9px;border-radius:999px;white-space:nowrap}
.fill-meal{margin-top:12px}
.fill-mt{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.fill-mt .muted{font-weight:400;font-size:12.5px}
.report-new,.report-link{display:flex;align-items:center;gap:12px;width:100%;font:inherit;color:inherit;cursor:pointer;text-align:left}
.report-new{border-color:var(--accent);background:var(--accent-soft)}
.rep-ic{width:36px;height:36px;border-radius:50%;background:var(--card);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.rep-ul{margin:6px 0 0;padding-left:20px}.rep-ul li{margin:3px 0}
.painrow{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}.painrow .btn{padding:8px 0;min-width:0}
.zbar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--line)}
.zbar .z1{background:#9bb7e6}.zbar .z2{background:#3f8f5a}.zbar .z3{background:#d9a72b}.zbar .z4{background:#e07a2e}.zbar .z5{background:#c9342b}
.planned-hint{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font:600 13px inherit;padding:0;cursor:pointer;text-decoration:underline}
.copybox{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.daychips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:6px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:8px 14px;border-radius:10px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Gym Tracker</h1>
    <span class="status" id="status">lädt …</span>
  </header>
  <div id="banner"></div>
  <main id="main"><div class="empty">Lädt …</div></main>
</div>

<div class="timer" id="timer">
  <div class="t" id="timerT">0:00</div>
  <div class="lbl" id="timerL">Pause</div>
  <button data-action="timer-add">+15 s</button>
  <button data-action="timer-stop"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<nav class="tabs" id="tabs">
  <button data-view="training"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg></span>Training</button>
  <button data-view="verlauf"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></span>Fortschritt</button>
  <button data-view="koerper"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3.5" width="18" height="17" rx="4"/><path d="M8 10a4 4 0 0 1 8 0"/><path d="M12 10l1.6-2.2"/></svg></span>Körper</button>
  <button data-view="velo"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M5.5 17l4-8h6l3 8M9.5 9L12 17h-1M14 5.5h2.5l-1 3.5"/></svg></span>Velo</button>
  <button data-view="ernaehrung"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.5c-1.6-1.2-5-1.6-6.6 1.4-1.6 3 -.6 7.6 1.9 10.4 1.4 1.6 2.9 2 4.7 1.1 1.8.9 3.3.5 4.7-1.1 2.5-2.8 3.5-7.4 1.9-10.4-1.6-3-5-2.6-6.6-1.4z"/><path d="M12 7.5c0-2.2 1.2-3.7 3.2-4.3"/></svg></span>Ernährung</button>
</nav>
<div class="toast" id="toast"></div>

<script src="db.js"></script>
<script src="seed.js"></script>
<script>

/* ============================================================
   Gym Tracker – Datenmodell (Datenbank des Artefakts)
   plans/<planId>        Trainingspläne (von Claude gepflegt)
   settings/app          { plan }
   workouts/<id>         { date, plan, planName, day, dayName, status: active|done,
                           entries:[{name,label,ss,sets,reps,repMin,repMax,rir,rest,note,
                                     log:[{kg,reps,rir,done}]}], note, startedAt, finishedAt, updatedAt }
   body/<YYYY-MM-DD>     { date, weight, arm, chest, waist, energy, note }
   Später: nutrition/<YYYY-MM-DD> und nutritionSettings/app (Ernährungstracker)
   ============================================================ */
const S = {
  db:null, ready:false, offline:false,
  plans:{}, settings:{plan:null}, workouts:[], body:[],
  view:'training', active:null, dirty:false, saving:false, saveAgain:false,
  confirm:null, progressEx:null, loaded:{plans:false,workouts:false,body:false,settings:false}
};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const today = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const fmtDate = s => { if(!s) return ''; const [y,m,d] = s.split('-'); const dt = new Date(+y, +m-1, +d);
  return dt.toLocaleDateString('de-CH',{weekday:'short', day:'numeric', month:'short'}); };
const num = v => { if(v===''||v==null) return null; const n = parseFloat(String(v).replace(',','.')); return isFinite(n)?n:null; };
const e1rm = (kg,reps) => (kg && reps) ? kg*(1+reps/30) : 0;
const fmtKg = n => (n==null?'–':(Math.round(n*10)/10).toString().replace('.',','));
const fmtDur = s => { s=Math.max(0,Math.round(s||0)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h? h+':'+pad(m)+':'+pad(s%60) : m+':'+pad(s%60); };
const fmtMin = s => s ? Math.round(s/60)+' min' : '–';
const elapsedSec = a => a && a.startedAt ? (Date.now()-new Date(a.startedAt).getTime())/1000 : 0;
setInterval(()=>{ const el=document.getElementById('elapsed'); if(el && S.active) el.textContent=fmtDur(elapsedSec(S.active)); },1000);
const fmtTime = s => { s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+pad(s%60); };

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }
function setStatus(txt){ $('#status').textContent = txt; }

/* ---------------- Datenbank ---------------- */
async function init(){
  render();
  const db=window.GT.db; S.db=db;
  GT.onStatus(st=>{ setStatus({local:'nur auf diesem Gerät',idle:'verbunden',loading:'lädt …',saving:'speichert …',synced:'gespeichert',offline:'offline – wird später gespeichert',error:'Sync-Fehler'}[st.state]||st.state); if(S.view==='koerper') softRender(); });
  setTimeout(()=>{ if(typeof handleHash==='function') handleHash(); },0);
  syncPlans(); loadReports(); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ syncPlans(); loadReports(); } });
  if(typeof nutInit==='function') nutInit(db);
  const loadTimer = setTimeout(()=>{ if(!S.ready){ setStatus('Daten noch nicht erreichbar'); renderBanner('Die Daten sind gerade nicht erreichbar. Prüfe die Internetverbindung – die App versucht es weiter.'); } }, 10000);
  const done = key => { S.loaded[key]=true; if(Object.values(S.loaded).every(Boolean)){ S.ready=true; clearTimeout(loadTimer); renderBanner(''); } };
  const onErr = e => { clearTimeout(loadTimer); setStatus('Fehler'); renderBanner('Fehler beim Laden der Daten ('+esc(e&&e.code)+').'); };

  db.collection('plans').onSnapshot(snap=>{
    const p={}; snap.docs.forEach(d=>{ p[d.id]=d.data(); }); S.plans=p;
    if(!snap.metadata.fromCache) done('plans'); softRender();
  }, onErr);
  db.doc('settings/app').onSnapshot(snap=>{
    S.settings = snap.exists ? {...snap.data()} : {plan:null};
    if(!snap.metadata.fromCache) done('settings'); softRender();
  }, onErr);
  db.collection('workouts').orderBy('date','desc').limit(500).onSnapshot(snap=>{
    S.workouts = snap.docs.map(d=>({id:d.id, ...d.data()}));
    const act = S.workouts.find(w=>w.status==='active');
    if(act && (!S.active || S.active.id!==act.id) && !S.dirty){ S.active = JSON.parse(JSON.stringify(act)); }
    if(!act && S.active && !S.dirty && !S.saving && !snap.metadata.hasPendingWrites){ S.active=null; }
    if(!snap.metadata.fromCache) done('workouts'); softRender();
  }, onErr);
  db.doc('library/exercises').onSnapshot(snap=>{ S.library=snap.exists?snap.data():{}; if(S.view==='technik') softRender(); }, ()=>{});
  db.doc('settings/calc').onSnapshot(snap=>{ if(snap.exists){ S.calc=snap.data(); if(S.view==='koerper') softRender(); } }, ()=>{});
  db.collection('cardio').onSnapshot(snap=>{ S.cardio=snap.docs.map(d=>({...d.data(), id:d.id})).sort((a,b)=>(b.date+(b.start||''))>(a.date+(a.start||''))?1:-1); if(S.view==='velo') softRender(); }, ()=>{});
  db.doc('settings/cardio').onSnapshot(snap=>{ S.cardioCfg=snap.exists?snap.data():null; if(S.view==='velo') softRender(); }, ()=>{});
  db.collection('body').orderBy('date','desc').limit(500).onSnapshot(snap=>{
    S.body = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(!snap.metadata.fromCache) done('body'); if(S.view==='koerper') softRender();
  }, onErr);
}

/* Trainingspläne aus dem Repository (plans.json) übernehmen, wenn dort eine neuere Version liegt */
async function syncPlans(){
  try{
    const r=await fetch('plans.json?v='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const src=await r.json(); if(!src||!src.version||!src.plans) return;
    const meta=await S.db.doc('meta/plans').get(); const cur=meta.exists?(meta.data().version||0):0;
    if(src.version<=cur) return;
    for(const [id,plan] of Object.entries(src.plans)) await S.db.doc('plans/'+id).set(plan);
    if(src.library) await S.db.doc('library/exercises').set(src.library);
    await S.db.doc('meta/plans').set({version:src.version, updated:src.updated||null, appliedAt:new Date().toISOString()});
    if(cur) toast('Trainingsplan aktualisiert');
  }catch(e){ console.warn('Plan-Update nicht möglich',e); }
}

/* Nicht neu zeichnen, während ein Eingabefeld aktiv ist (Fokus bleibt erhalten) */
function softRender(){
  const ae=document.activeElement;
  if(ptrDown || (ae && $('#main').contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))){ softRender.pending=true; return; }
  render();
}
let ptrDown=false;
function flushSoft(){ if(!softRender.pending || ptrDown) return; softRender.pending=false; softRender(); }
document.addEventListener('pointerdown', ()=>{ ptrDown=true; }, true);
document.addEventListener('pointerup', ()=>{ ptrDown=false; setTimeout(flushSoft,300); }, true);
document.addEventListener('focusout', ()=>{ setTimeout(flushSoft,300); });
function renderBanner(msg){ $('#banner').innerHTML = msg ? '<div class="banner">'+msg+'</div>' : ''; }

async function dbWrite(fn){
  try{ await fn(); return true; }
  catch(e){
    if(e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r, 500+Math.random()*800)); try{ await fn(); return true; }catch(e2){ e=e2; } }
    toast('Speichern fehlgeschlagen'); setStatus('nicht gespeichert'); console.error(e); return false;
  }
}

/* Aktives Training: gesammelt speichern (ein Schreibvorgang gleichzeitig) */
function scheduleSave(){ S.dirty=true; setStatus('speichert …'); clearTimeout(scheduleSave._t); scheduleSave._t=setTimeout(saveActive, 700); }
async function saveActive(){
  if(!S.db || !S.active) return;
  if(S.saving){ S.saveAgain=true; return; }
  S.saving=true; S.dirty=false;
  const a = {...S.active, updatedAt:new Date().toISOString()}; const id=a.id; delete a.id;
  const ok = await dbWrite(()=>S.db.doc('workouts/'+id).set(a));
  S.saving=false;
  if(ok && !S.dirty) setStatus('gespeichert');
  if(S.saveAgain){ S.saveAgain=false; saveActive(); }
}

/* ---------------- Hilfsfunktionen Training ---------------- */
function planList(){ return Object.entries(S.plans).filter(([,p])=>!p.hidden).sort((a,b)=>(a[1].order||0)-(b[1].order||0)); }
function currentPlanId(){ const ids=planList().map(p=>p[0]); return ids.includes(S.settings.plan) ? S.settings.plan : ids[0]; }
function doneWorkouts(){ return S.workouts.filter(w=>w.status==='done'); }
function suggestedDay(planId){
  const plan=S.plans[planId]; if(!plan) return null;
  const last = doneWorkouts().find(w=>w.plan===planId);
  if(!last) return plan.days[0].id;
  const i = plan.days.findIndex(d=>d.id===last.day);
  return plan.days[(i+1) % plan.days.length].id;
}
/* ---------------- 16-Wochen-Zyklus ---------------- */
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dateOf=iso=>{ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); };
const daysBetween=(a,b)=>Math.round((dateOf(b)-dateOf(a))/864e5);
function mondayOf(iso){ const d=dateOf(iso); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return isoOf(d); }
function addDays(iso,n){ const d=dateOf(iso); d.setDate(d.getDate()+n); return isoOf(d); }
const PHASES=[
  {from:1, to:6,  key:'b1', name:'Block 1 · Aufbau'},
  {from:7, to:7,  key:'d1', name:'Deload', deload:true},
  {from:8, to:13, key:'b2', name:'Block 2 · Variation'},
  {from:14,to:14, key:'d2', name:'Deload', deload:true},
  {from:15,to:16, key:'ev', name:'Auswertung & Übergang'}
];
function weekOf(iso){ const st=S.settings.cycleStart; if(!st) return null; return Math.floor(daysBetween(st, mondayOf(iso))/7)+1; }
function cycleInfo(iso){
  const st=S.settings.cycleStart; if(!st) return null;
  const week=weekOf(iso||today());
  if(week<1) return {week, pre:true, start:st, name:'Vorbereitung', deload:false, block2:false};
  const ph=PHASES.find(p=>week>=p.from&&week<=p.to) || {key:'done', name:'Zyklus abgeschlossen'};
  return {week, start:st, key:ph.key, name:ph.name, deload:!!ph.deload, block2:week>=8&&week<=16, done:week>16};
}
const curLoc=()=>S.settings.location==='home'?'home':'gym';
function applyCycle(e, info, loc){
  let x={...e};
  if((loc||curLoc())==='home' && e.home){ x={...x, ...e.home, gymName:e.name}; delete x.block2; delete x.home; }
  else { delete x.home; if(info && info.block2 && e.block2) x={...x, ...e.block2, swappedFrom:e.name}; }
  if(info && info.deload){ x.sets=Math.max(1,Math.ceil((x.sets||1)/2)); x.rir='3'; x.deload=true; }
  return x;
}
function dayExercises(day, info, loc){ return (day.exercises||[]).map(e=>applyCycle(e,info,loc)); }
function workoutsInWeek(monday){ const end=addDays(monday,6); return doneWorkouts().filter(w=>w.date>=monday && w.date<=end); }
function dayType(id){ return String(id||'').split('-')[0]; }

/* Wochenplaner: verteilt die offenen Trainings der Woche auf die restlichen Tage.
   Regeln: nicht 3 Tage am Stück, nicht zweimal hintereinander dieselbe Muskelgruppe,
   ausgelassene Trainings zuerst (am längsten nicht gemacht), und alles muss bis Sonntag passen. */
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
function shortDay(d){ return d.name.replace('Brust & Rücken','B&R').replace('Arme & Schulter','A&S').replace(' – ',' '); }
/* offset: 0 = diese Woche, 1 = nächste Woche, -1 = letzte Woche … */
function planWeek(pid, offset){
  offset=offset||0;
  const plan=S.plans[pid]; if(!plan) return null;
  const t=today(), mon0=mondayOf(t);
  const all=doneWorkouts();
  const byDate={}; all.forEach(w=>{ (byDate[w.date]=byDate[w.date]||[]).push(w); });
  const sim={}; // geplante Trainings: date -> day
  const trainedOn=iso=>!!(byDate[iso]&&byDate[iso].length)||!!sim[iso];
  const typeOn=iso=>sim[iso]?dayType(sim[iso].id):(byDate[iso]&&byDate[iso][0]?dayType(byDate[iso][0].day):null);
  const streakBefore=iso=>{ let n=0, d=addDays(iso,-1); while(trainedOn(d)&&n<7){ n++; d=addDays(d,-1); } return n; };
  const lastDate=id=>{ let best='0000'; const w=all.find(x=>x.plan===pid&&x.day===id); if(w) best=w.date; for(const k in sim) if(sim[k].id===id && k>best) best=k; return best; };
  const groupGap=(type,iso)=>{ for(let k=1;k<=7;k++){ const d=addDays(iso,-k); if(sim[d]&&dayType(sim[d].id)===type) return k; if((byDate[d]||[]).some(w=>w.plan===pid&&dayType(w.day)===type)) return k; } return 99; };
  const order=list=>list.sort((a,b)=>lastDate(a.id).localeCompare(lastDate(b.id))||plan.days.indexOf(a)-plan.days.indexOf(b));
  const doneIn=mon=>new Set(workoutsInWeek(mon).filter(w=>w.plan===pid).map(w=>w.day));

  /* Optimale Verteilung der offenen Trainings auf die restlichen Tage der Woche.
     Harte Regeln: gleiche Muskelgruppe nie an zwei Tagen hintereinander (48 h Erholung),
     nie mehr als 3 Trainingstage am Stück. Ziel: möglichst alle Trainings unterbringen,
     dann möglichst wenige "3. Tag am Stück", dann ausgelassene zuerst, dann möglichst früh. */
  const typeAt=iso=>sim[iso]?dayType(sim[iso].id):(byDate[iso]&&byDate[iso][0]?dayType(byDate[iso][0].day):null);
  const streakAt=iso=>{ let n=0, d=addDays(iso,-1); while(typeAt(d)&&n<7){ n++; d=addDays(d,-1); } return n; };
  function buildWeek(mon){
    const doneIds=doneIn(mon);
    const remaining=order(plan.days.filter(d=>!doneIds.has(d.id)));
    const fut=[]; for(let i=0;i<7;i++){ const iso=addDays(mon,i); if(iso>=t && !(byDate[iso]&&byDate[iso].length)) fut.push(iso); }
    let best=null; const pick=[];
    (function rec(j, rem, triples, pen, sumIdx){
      if(j===fut.length || !rem.length){
        const sc=[-(remaining.length-rem.length), triples, pen, sumIdx];
        if(!best || sc.some((v,k)=>v!==best.sc[k]) && (()=>{ for(let k=0;k<4;k++){ if(sc[k]!==best.sc[k]) return sc[k]<best.sc[k]; } return false; })()) best={sc, plan:pick.slice()};
        return;
      }
      const iso=fut[j], st=streakAt(iso), prevT=typeAt(addDays(iso,-1));
      if(st<3){
        rem.forEach((d,ri)=>{
          if(dayType(d.id)===prevT) return;               // 48 h für dieselben Muskeln
          if(rem.slice(0,ri).some(x=>dayType(x.id)===dayType(d.id))) return; // gleiche Gruppe: ältestes zuerst
          sim[iso]=d; pick.push([iso,d]);
          rec(j+1, rem.filter(x=>x!==d), triples+(st===2?1:0), pen+ri, sumIdx+j);
          pick.pop(); delete sim[iso];
        });
      }
      rec(j+1, rem, triples, pen, sumIdx);               // Ruhetag
    })(0, remaining, 0, 0, 0);
    (best?best.plan:[]).forEach(([iso,d])=>{ sim[iso]=d; });
    const planned=best?best.plan.length:0, dropped=remaining.length-planned;
    const days=[]; let left=planned;
    for(let i=0;i<7;i++){
      const iso=addDays(mon,i), ws=(byDate[iso]||[]);
      const cell={iso, wd:WD[i], isToday:iso===t, past:iso<t};
      if(ws.length){ cell.status='done'; cell.label=ws.map(w=>{ const d=plan.days.find(x=>x.id===w.day); return d?shortDay(d):w.dayName; }).join(' + '); days.push(cell); continue; }
      if(iso<t){ cell.status='rest'; cell.label='Ruhe'; days.push(cell); continue; }
      const D=7-i, st=streakAt(iso), prevT=typeAt(addDays(iso,-1));
      if(sim[iso]){
        const d=sim[iso]; cell.status='train'; cell.day=d; cell.label=shortDay(d);
        cell.reason= st===2 ? '3. Tag am Stück ist hier vertretbar: andere Muskeln als gestern, und die Muskeln von vorgestern hatten 48 h Pause. Studien zeigen bei 3 Trainingstagen am Stück ähnliche Fortschritte wie mit Pausentagen.'
          : left===1 ? 'Das letzte offene Training dieser Woche.'
          : 'Noch '+left+' Trainings in '+D+' Tag'+(D>1?'en':'')+'.';
        left--;
      } else {
        cell.status='rest'; cell.label='Ruhe';
        if(!remaining.length) cell.reason='Alle Trainings dieser Woche sind erledigt.';
        else if(!left) cell.reason='Die übrigen Trainings dieser Woche sind schon eingeplant.';
        else if(st>=3) cell.reason='Schon 3 Tage am Stück trainiert – heute Pause, ein 4. Tag bringt mehr Ermüdung als Nutzen.';
        else if(st===2) cell.reason='2 Tage am Stück trainiert – heute Pause, die restlichen Trainings passen trotzdem in die Woche.';
        else if(prevT && remaining.every(d=>dayType(d.id)===prevT||!(left))) cell.reason='Offen sind nur Trainings für die Muskeln von gestern – die brauchen 48 h Erholung.';
        else cell.reason='Ruhetag – die offenen Trainings passen trotzdem in die Woche.';
        const nx=best&&best.plan.find(([d])=>d>iso); if(nx) cell.next=nx[1];
      }
      days.push(cell);
    }
    if(dropped>0){
      const msg=' Diese Woche passen nicht mehr alle Trainings – '+dropped+' fällt weg. Das ist besser, als dieselben Muskeln nach 24 h erneut zu belasten oder 4 Tage am Stück zu trainieren; ein ausgelassenes Training kostet kaum Fortschritt.';
      const first=days.find(c=>c.iso>=t&&c.status!=='done'); if(first) first.reason=(first.reason||'')+msg;
    }
    return days;
  }

  if(offset<0){ const mon=addDays(mon0,7*offset); return {mon, offset, days:buildWeek(mon)}; }
  let days=null, curDays=null;
  for(let w=0; w<=offset; w++){ const d=buildWeek(addDays(mon0,7*w)); if(w===0) curDays=d; if(w===offset) days=d; }
  const res={mon:addDays(mon0,7*offset), offset, days};
  // Infos zu heute (immer aus der aktuellen Woche)
  const todayCell=curDays.find(d=>d.isToday);
  res.today=todayCell; res.trainedToday=todayCell.status==='done';
  res.next=curDays.find(d=>d.iso>t && d.status==='train');
  if(!res.next){ const nw=offset>=1?null:buildWeek(addDays(mon0,7)); if(nw) res.next=nw.find(d=>d.status==='train'); }
  const doneIds=doneIn(mon0);
  const openNow=plan.days.filter(d=>!doneIds.has(d.id)).sort((a,b)=>((all.find(x=>x.plan===pid&&x.day===a.id)||{}).date||'0000').localeCompare(((all.find(x=>x.plan===pid&&x.day===b.id)||{}).date||'0000'))||plan.days.indexOf(a)-plan.days.indexOf(b));
  const prevT=byDate[addDays(t,-1)]&&byDate[addDays(t,-1)][0]?dayType(byDate[addDays(t,-1)][0].day):null;
  res.anyway=openNow.find(d=>dayType(d.id)!==prevT)||openNow[0]||plan.days.find(d=>d.id===suggestedDay(pid));
  res.anywayWarn=res.anyway && prevT && dayType(res.anyway.id)===prevT;
  res.weekDone=!openNow.length;
  return res;
}
function viewWeekStrip(pid){
  const off=S.weekOff||0, wp=off===0?S._wp:planWeek(pid,off);
  const wk=weekOf(wp.mon), ph=wk&&wk>=1?PHASES.find(p=>wk>=p.from&&wk<=p.to):null;

/* Empfehlung: was ist als Nächstes dran? */
function recommend(pid){
  const plan=S.plans[pid]; if(!plan) return null;
  const t=today(), mon=mondayOf(t), weekW=workoutsInWeek(mon).filter(w=>w.plan===pid);
  const doneIds=new Set(weekW.map(w=>w.day));
  const all=doneWorkouts(), last=all[0];
  const lastPlan=all.find(w=>w.plan===pid);
  const trainedToday=last && last.date===t;
  const yesterday=last && daysBetween(last.date,t)===1;
  const daysLeft=7-((dateOf(t).getDay()+6)%7); // inkl. heute
  let remaining=plan.days.filter(d=>!doneIds.has(d.id));
  const lastDate=id=>{ const w=all.find(x=>x.plan===pid&&x.day===id); return w?w.date:'0000'; };
  const reasons=[];
  if(!remaining.length){
    const d=plan.days.find(x=>x.id===suggestedDay(pid));
    return {day:d, extra:true, text:'Alle '+plan.days.length+' Trainings dieser Woche erledigt '+I('checkc')+'. Nächste Woche geht es mit '+d.name+' weiter – ein Zusatztraining nur, wenn du dich gut erholt fühlst.'};
  }
  // gleiche Muskelgruppe wie gestern/heute vermeiden, wenn es eine Alternative gibt
  let pool=remaining;
  if((yesterday||trainedToday) && last.plan===pid){
    const other=remaining.filter(d=>dayType(d.id)!==dayType(last.day));
    if(other.length && other.length<remaining.length){ pool=other; reasons.push((trainedToday?'Heute':'Gestern')+' war '+last.dayName+' – diese Muskeln brauchen Erholung.'); }
  }
  // am längsten nicht gemacht zuerst (holt ausgelassene Trainings nach), sonst Reihenfolge
  pool=[...pool].sort((a,b)=>lastDate(a.id).localeCompare(lastDate(b.id)) || plan.days.indexOf(a)-plan.days.indexOf(b));
  const pick=pool[0];
  const rot=suggestedDay(pid);
  if(lastPlan && pick.id!==rot){
    const idxPick=plan.days.findIndex(d=>d.id===pick.id), idxLast=plan.days.findIndex(d=>d.id===lastPlan.day);
    if(idxPick<idxLast && !doneIds.has(pick.id)) reasons.push(pick.name+' fehlt diese Woche noch und wird nachgeholt.');
  }
  if(remaining.length>1) reasons.push('Diese Woche noch offen: '+remaining.map(d=>d.name).join(', ')+'.');
  if(remaining.length>daysLeft) reasons.push('Es bleiben nur noch '+daysLeft+' Tag'+(daysLeft>1?'e':'')+' – lieber ein Training auslassen als zwei Tage am Stück dieselben Muskeln.');
  if(trainedToday) reasons.unshift('Heute hast du schon trainiert – das ist dein nächstes Training (am besten morgen).');
  return {day:pick, text:reasons.join(' ')};
}

/* ---------------- Gewichtsempfehlung aus dem Verlauf ----------------
   Basis: geschätztes 1RM pro Training mit RIR-Korrektur: kg × (1 + (Wdh + RIR)/30).
   Doppelte Progression; Pausen bis ~4 Wochen ändern die Maximalkraft kaum (Bosquet 2013),
   darüber wird vorsichtig reduziert. */
function parseRir(r){ const m=String(r??'').match(/\d+/g); if(!m) return 1; const a=+m[0], b=m[1]!=null?+m[1]:a; return (a+b)/2; }
function stepFor(kg){ return kg>=20?2.5:1; }
function roundKg(kg){ const st=stepFor(kg); return Math.max(st, Math.round(kg/st)*st); }
function sessionsFor(name, excludeId){
  const out=[];
  for(const w of doneWorkouts()){
    if(w.id===excludeId) continue;
    const e=(w.entries||[]).find(x=>x.name===name); if(!e) continue;
    const sets=(e.log||[]).filter(s=>s.done&&s.reps&&(s.kg||e.unit==='bw'||e.unit==='band')); if(!sets.length) continue;
    out.push({date:w.date, reps:e.reps, repMin:e.repMin, repMax:e.repMax, sets});
  }
  return out;
}
function recommendFor(e, a){
  const r=recommendForRaw(e,a);
  if(r && !r.none && e.maxKg && r.kg>e.maxKg){
    return {kg:e.maxKg, reps:e.repMax+'+', repsNum:e.repMax, up:true, why:'Maximalgewicht zuhause ('+fmtKg(e.maxKg)+' kg) erreicht → mehr Wdh., 3 s ablassen oder 1 s Pause in der Dehnung'};
  }
  return r;
}
function recommendForRaw(e, a){
  if(!e.repMax) return null;                         // z. B. Jefferson Curl: keine Gewichtsvorgabe
  const ss=sessionsFor(e.name, a&&a.id);
  if(!ss.length) return {none:true, why:e.unit==='band'?'Noch kein Verlauf – starte mit dem mittleren Band (2) und taste dich an RIR '+e.rir+' heran.':e.unit==='bw'?'Noch kein Verlauf – so viele saubere Wdh. wie möglich mit RIR '+e.rir+'.':'Noch kein Verlauf – starte bewusst leicht und taste dich an RIR '+e.rir+' heran.'};
  if(e.unit==='band'||e.unit==='bw') return recommendSimple(e,ss,a);
  const rirT=parseRir(e.rir);
  const deload=a?(a.phase==='d1'||a.phase==='d2'):!!(cycleInfo()&&cycleInfo().deload);
  const e1=s=>s.kg*(1+(s.reps+(s.rir!=null&&s.rir!==''?+s.rir:rirT))/30);
  const sesE1=x=>Math.max(...x.sets.map(e1));
  const L=ss[0];
  let base=sesE1(L); if(ss[1]) base=0.7*base+0.3*sesE1(ss[1]);
  const lastKg=Math.max(...L.sets.map(s=>s.kg));
  const why=[]; let kg, reps, up=false;
  const sameRange=L.repMin===e.repMin && L.repMax===e.repMax;
  if(!sameRange){
    const mid=Math.round((e.repMin+e.repMax)/2);
    kg=roundKg(base/(1+(mid+rirT)/30)); reps=e.repMin+'–'+e.repMax;
    why.push('Aus deinem e1RM berechnet (letztes Mal anderer Wdh.-Bereich: '+L.reps+')');
  } else {
    const allTop=L.sets.length>=Math.min(e.sets,3) && L.sets.every(s=>s.reps>=e.repMax);
    const tooHeavy=L.sets.filter(s=>s.reps<e.repMin).length>=Math.ceil(L.sets.length/2);
    if(allTop){
      kg=roundKg(lastKg+stepFor(lastKg)); up=true; // eine Gewichtsstufe – kleine Schritte halten die Wdh. im Zielbereich
      reps=e.repMin+'–'+Math.min(e.repMax,e.repMin+2); why.push('Letztes Mal alle Sätze am oberen Ende → Gewicht hoch');
    } else if(tooHeavy){
      kg=Math.min(lastKg, roundKg(base/(1+(e.repMin+1+rirT)/30))); reps=e.repMin+'–'+e.repMax;
      why.push('Letztes Mal meist unter '+e.repMin+' Wdh. → '+(kg<lastKg?'etwas leichter':'gleiches Gewicht'));
    } else {
      kg=lastKg; const minR=Math.min(...L.sets.map(s=>s.reps)); reps=Math.min(e.repMax,minR+1)+'+';
      why.push('Gleiches Gewicht, Ziel: 1 Wdh. mehr als letztes Mal');
    }
  }
  const gap=daysBetween(L.date, today());
  if(gap>35){ kg=roundKg(kg*0.9); up=false; why.push(gap+' Tage seit dem letzten Mal → 10 % leichter einsteigen'); }
  else if(gap>21){ kg=roundKg(kg*0.95); up=false; why.push(gap+' Tage seit dem letzten Mal → 5 % leichter einsteigen'); }
  else if(gap>=10) why.push(gap+' Tage Pause – kein Abzug nötig, Kraft bleibt so lange erhalten');
  if(ss.length>=3 && !up && sameRange){ const t=ss.slice(0,3).map(sesE1); if(t[0]<=t[2]*1.01) why.push('Seit 3 Trainings kein Fortschritt – Schlaf, Protein und Technik prüfen'); }
  if(deload){ kg=roundKg(Math.min(kg,lastKg)*0.9); reps=e.repMin+'–'+e.repMax; up=false; why.length=0; why.push('Deload: ca. 10 % leichter, 3 Wdh. Reserve'); }
  return {kg, reps, repsNum:parseInt(reps), up, why:why.join(' · ')};
}
function fmtLoad(kg,unit){ if(unit==='band') return 'Band '+fmtKg(kg); if(unit==='bw') return kg?'KG +'+fmtKg(kg)+' kg':'Körpergew.'; return fmtKg(kg)+' kg'; }
function recommendSimple(e,ss,a){
  // Bänder (Stufe 1–3) und Körpergewicht: über Wiederholungen und Bandstärke steigern
  const L=ss[0], minR=Math.min(...L.sets.map(s=>s.reps)), allTop=L.sets.every(s=>s.reps>=e.repMax);
  const deload=a?(a.phase==='d1'||a.phase==='d2'):!!(cycleInfo()&&cycleInfo().deload);
  if(e.unit==='band'){
    const lv=Math.max(...L.sets.map(s=>s.kg||1));
    if(deload) return {kg:Math.max(1,lv-1), reps:e.repMin+'–'+e.repMax, repsNum:e.repMin, why:'Deload: ein Band leichter, 3 Wdh. Reserve'};
    if(allTop && lv<3) return {kg:lv+1, reps:e.repMin+'+', repsNum:e.repMin, up:true, why:'Letztes Mal alle Sätze am oberen Ende → nächstes Band'};
    if(allTop) return {kg:3, reps:e.repMax+'+', repsNum:e.repMax, up:true, why:'Stärkstes Band: Band kürzer greifen oder 3 s ablassen'};
    return {kg:lv, reps:Math.min(e.repMax,minR+1)+'+', repsNum:Math.min(e.repMax,minR+1), why:'Gleiches Band, Ziel: 1 Wdh. mehr'};
  }
  const add=Math.max(...L.sets.map(s=>s.kg||0));
  if(deload) return {kg:add, reps:e.repMin+'–'+e.repMax, repsNum:e.repMin, why:'Deload: halbe Sätze, 3 Wdh. Reserve'};
  if(allTop) return {kg:add, reps:e.repMax+'+', repsNum:e.repMax, up:true, why:/Klimmz/.test(e.name)?'Oberes Ende erreicht → 3 s ablassen, oben 1 s halten':'Oberes Ende erreicht → Füsse höher, 3 s ablassen oder 1 s Pause unten'};
  return {kg:add, reps:Math.min(e.repMax,minR+1)+'+', repsNum:Math.min(e.repMax,minR+1), why:'Ziel: 1 Wdh. mehr als letztes Mal'};
}
function recoHtml(r,unit){
  if(!r) return '';
  if(r.none) return '<div class="reco none">'+I('target')+' '+esc(r.why)+'</div>';
  const load=unit==='bw'?(r.kg?'+'+fmtKg(r.kg)+' kg × ':''):fmtLoad(r.kg,unit)+' × ';
  return '<div class="reco'+(r.up?' up':'')+'">'+I('target')+' Heute: <b>'+load+esc(r.reps)+' Wdh.</b><span>'+esc(r.why)+'</span></div>';
}

function lastFor(name, excludeId){
  for(const w of doneWorkouts()){
    if(w.id===excludeId) continue;
    const e=(w.entries||[]).find(x=>x.name===name);
    if(e){ const sets=(e.log||[]).filter(s=>s.done && s.reps); if(sets.length) return {w, e, sets}; }
  }
  return null;
}
function progressionHint(ex, last){
  if(!last || !ex.repMax) return null;
  const sets = last.sets;
  if(sets.length >= (ex.sets||sets.length) && sets.every(s=>s.reps >= ex.repMax)) return 'up';
  return null;
}

/* ---------- Fortschritt ---------- */
function exerciseSeries(name){
  const pts=[];
  doneWorkouts().slice().reverse().forEach(w=>{
    const e=(w.entries||[]).find(x=>x.name===name); if(!e) return;
    const sets=(e.log||[]).filter(s=>s.done&&s.kg&&s.reps); if(!sets.length) return;
    pts.push({date:w.date, e1:Math.max(...sets.map(s=>e1rm(s.kg,s.reps))), kg:Math.max(...sets.map(s=>s.kg)),
      vol:sets.reduce((a,s)=>a+s.kg*s.reps,0), sets});
  });
  return pts;
}
const MAIN_LIFTS=['Brustpresse Maschine','Schrägbankdrücken Multipresse','Latzug breit','Latzug eng / Neutralgriff','Rudermaschine brustgestützt','Schulterpresse Maschine'];
function viewCycle(){
  const st=S.settings.cycleStart, pid=currentPlanId(), perWeek=(S.plans[pid]&&S.plans[pid].days.length)||4;
  let h='<div class="card"><h2>16-Wochen-Zyklus</h2>';

    h+='<div class="small muted" style="margin-bottom:8px">Start '+fmtDate(st)+' · '+(info.pre?'beginnt in '+daysBetween(today(),st)+' Tagen':info.done?'abgeschlossen':'Woche '+cur+' von 16 · '+esc(info.name))+'</div>';
    let pastDone=0, possible=0;
    h+='<div class="weeks">';
    for(let w=1;w<=16;w++){
      const mon=addDays(st,(w-1)*7), n=workoutsInWeek(mon).length, ph=PHASES.find(p=>w>=p.from&&w<=p.to);
      const past=w<cur, isCur=w===cur, fut=w>cur;

      h+='<div class="wk16 '+cls+'"><b>W'+w+'</b><div class="dots">'+'●'.repeat(Math.min(n,target))+'○'.repeat(Math.max(0,target-n))+'</div><div class="ph">'+(ph?(ph.deload?'Deload':ph.key==='ev'?'Auswertung':ph.key==='b2'?'Block 2':'Block 1'):'')+'</div></div>';

  return h+'</div>';
}

function lineChart(el, pts, unit){
  if(!el) return; if(pts.length<2){ el.innerHTML='<div class="small muted" style="padding:8px 0">Ab dem zweiten Eintrag erscheint hier eine Kurve.</div>'; return; }
  const W=600,H=180,P={l:40,r:12,t:12,b:24};
  const ys=pts.map(p=>p.y), min=Math.min(...ys), max=Math.max(...ys), span=(max-min)||1;
  const x=i=>P.l+(W-P.l-P.r)*(i/(pts.length-1)), y=v=>P.t+(H-P.t-P.b)*(1-(v-min+span*0.1)/(span*1.2));
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p.y).toFixed(1)).join(' ');

/* ---------- Körper ---------- */
const MEASURE_DAYS=28;
const ACT=[[1.2,'Kaum aktiv','Sitzend, kaum Bewegung, kein Sport'],[1.375,'Leicht aktiv','1–3× Training/Woche oder viel Gehen'],[1.55,'Mässig aktiv','3–5× Training/Woche'],[1.725,'Sehr aktiv','6–7× Training/Woche oder körperliche Arbeit'],[1.9,'Extrem aktiv','Harte körperliche Arbeit + tägliches Training']];
const GOALS_C={build:['Muskelaufbau','+10 % Kalorien (leichter Überschuss)',1.10,1.8],keep:['Gewicht halten','Erhaltungskalorien',1.0,1.8],cut:['Fett abbauen','−20 % Kalorien (Defizit)',0.80,2.2]};
function lastMeasure(){ return (S.body||[]).find(b=>b.arm!=null||b.chest!=null||b.waist!=null)||null; }
function calcMacros(c){
  if(!c||!c.weight||!c.height||!c.age||!c.sex||!c.act||!c.goal) return null;
  const bmr=10*c.weight+6.25*c.height-5*c.age+(c.sex==='m'?5:-161);      // Mifflin-St Jeor
  const tdee=bmr*c.act, G=GOALS_C[c.goal], kcal=Math.round(tdee*G[2]/10)*10;
  const protein=Math.round(c.weight*G[3]);
  const fat=Math.round(Math.max(kcal*0.25/9, c.weight*0.8));
  const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), kcal, protein, fat, carbs};
}
// Tatsächlicher Verbrauch aus Gewichtstrend + erfasster Energiezufuhr (Energiebilanz)
const KCAL_PER_KG=7700, ADAPT={days:10, weighs:4, span:14, window:28};
function macrosFrom(kcal, weight, goal){
  const G=GOALS_C[goal||'keep']; kcal=Math.round(kcal/10)*10;
  const protein=Math.round(weight*G[3]), fat=Math.round(Math.max(kcal*0.25/9, weight*0.8));
  return {kcal, protein, fat, carbs:Math.max(0,Math.round((kcal-protein*4-fat*9)/4))};
}
function adaptiveTDEE(){
  const end=addDays(today(),-1), start=addDays(end,-(ADAPT.window-1));
  const W=(S.body||[]).filter(b=>b.weight&&b.date>=start&&b.date<=today()).slice().sort((a,b)=>a.date<b.date?-1:1);
  const span=W.length?daysBetween(W[0].date,W[W.length-1].date):0;
  const from=W.length?W[0].date:start, days=[];
  for(let d=from; d<=end; d=addDays(d,1)){ if(typeof dayTotals!=='function') break; const {t,open}=dayTotals(d); if(!open && t.kcal>=1000) days.push(t.kcal); }
  const st={days:days.length, weighs:W.length, span};
  if(days.length<ADAPT.days || W.length<ADAPT.weighs || span<ADAPT.span) return {...st, need:true};
  const xs=W.map(b=>daysBetween(W[0].date,b.date)), ys=W.map(b=>b.weight), n=xs.length;
  const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  const slope=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/xs.reduce((a,x)=>a+(x-mx)**2,0);   // kg/Tag
  const avg=days.reduce((a,b)=>a+b,0)/days.length;
  return {...st, avg:Math.round(avg), perWeek:slope*7, tdee:Math.round((avg-slope*KCAL_PER_KG)/10)*10, weight:ys[n-1]};
}
function viewAdaptive(c){
  const a=adaptiveTDEE(), f=calcMacros(c);

  h+='<div class="mini3" style="margin-top:10px"><div><span>Ø gegessen</span><b>'+a.avg+'</b><span>kcal/Tag</span></div><div><span>Gewichtstrend</span><b style="font-size:15px">'+trend+'</b><span>&nbsp;</span></div><div><span>Erhaltung</span><b>'+a.tdee+'</b><span>kcal</span></div></div>';

  h+='<div class="last up" style="margin-top:8px">'+esc(GOALS_C[goal][0])+': <b>'+m.kcal+' kcal</b> · P '+m.protein+' g · F '+m.fat+' g · KH '+m.carbs+' g</div>'+
    '<div class="small muted" style="margin-top:4px">Basis: '+a.days+' erfasste Tage, '+a.weighs+' Wägungen über '+a.span+' Tage. Faustregel 1 kg Körpermasse ≈ 7700 kcal; vergessene Einträge lassen den Verbrauch zu tief erscheinen.</div>'+
    '<button class="btn primary block" style="margin-top:10px" data-action="adapt-apply">Tagesziele daran anpassen</button></div>';
  return h;
}

const CARDIO_DEF={sessions:3, startMin:20, maxMin:45, step:5, painMax:3, note:''};

const isBike=c=>/cycl|bik|ride|velo|ergo/.test((c.type||'')+' '+(c.name||'').toLowerCase());
function cardioWeek(mon){ const end=addDays(mon,6); return (S.cardio||[]).filter(c=>c.date>=mon&&c.date<=end&&isBike(c)); }
/* Wochenziel: Start mit startMin; +step pro Woche, wenn letzte Woche erfüllt und Knie ruhig; Rückschritt bei Schmerz > painMax oder Schwellung */
function cardioPlan(){
  const cfg=cardioCfg(), all=(S.cardio||[]).filter(isBike); const mon=mondayOf(today());
  const first=all.length?mondayOf(all[all.length-1].date):mon;
  let min=cfg.startMin, flag=null, w=first;
  while(w<mon){
    const s=cardioWeek(w), pains=s.map(c=>c.pain).filter(v=>v!=null), swell=s.some(c=>c.swell);
    const bad=swell||pains.some(p=>p>cfg.painMax), good=s.length>=cfg.sessions && s.every(c=>c.min>=min*0.8) && !bad && pains.length>=Math.min(s.length,1);
    if(bad){ min=Math.max(10,min-cfg.step); flag='Letzte Woche: Schmerz über '+cfg.painMax+'/10 oder Schwellung → Dauer reduziert. Mit der Physio besprechen.'; }
    else if(good){ min=Math.min(cfg.maxMin,min+cfg.step); flag=null; }
    else flag=null;
    w=addDays(w,7);
  }
  const info=cycleInfo(); if(info&&info.deload) min=Math.max(10,Math.round(min*0.75/5)*5);
  return {min, sessions:cfg.sessions, flag, deload:!!(info&&info.deload)};
}

    const G=GOALS_C[c.goal];
    h+='<div class="mini3" style="margin-top:10px"><div><span>Grundumsatz</span><b>'+r.bmr+'</b><span>kcal</span></div><div><span>Erhaltung</span><b>'+r.tdee+'</b><span>kcal</span></div><div><span>Ziel</span><b>'+r.kcal+'</b><span>kcal</span></div></div>'+
      '<div class="mini3" style="margin-top:6px"><div><span>Protein</span><b>'+r.protein+' g</b><span>'+G[3].toString().replace('.',',')+' g/kg</span></div><div><span>Fett</span><b>'+r.fat+' g</b><span>≈ 25 %</span></div><div><span>Kohlenhydrate</span><b>'+r.carbs+' g</b><span>Rest</span></div></div>'+
      '<div class="small muted" style="margin-top:6px">'+esc(G[0])+': '+esc(G[1])+'. Mifflin-St-Jeor-Formel; Ergebnis ist ein Startwert – nach 2–3 Wochen am Gewichtstrend nachjustieren'+(c.goal==='build'?' (Ziel: ca. +0,5–1 % Körpergewicht pro Monat)':c.goal==='cut'?' (Ziel: ca. 0,5–1 % Körpergewicht pro Woche)':'')+'.</div>'+
      '<button class="btn primary block" style="margin-top:10px" data-action="calc-apply">In Ernährung als Tagesziele übernehmen</button>';
  } else h+='<div class="small muted" style="margin-top:8px">Fülle alle Felder aus und tippe auf «Berechnen».</div>';
  h+='</div>';
  h+=viewAdaptive(c);
  h+=viewSync();
  setTimeout(drawCharts,0);
  return h;
}

/* ---------------- Aktionen ---------------- */
async function startWorkout(dayId){
  if(!S.db) return;
  const pid=currentPlanId(), plan=S.plans[pid], day=plan.days.find(d=>d.id===dayId);
  const id = today()+'-'+Date.now().toString(36);
  const info=cycleInfo();
  S.active = { id, date:today(), plan:pid, planName:plan.name, day:day.id, dayName:day.name, status:'active',
    startedAt:new Date().toISOString(), note:'', cycleWeek:info&&!info.pre?info.week:null, phase:info&&!info.pre?info.key:null, location:curLoc(),
    entries: dayExercises(day,info).map(e=>({ name:e.name, label:e.label, ss:e.ss||null, sets:e.sets, reps:e.reps, repMin:e.repMin, repMax:e.repMax, unit:e.unit||null, maxKg:e.maxKg||null,
      rir:e.rir, rest:e.rest, note:e.note||'', log:Array.from({length:e.sets},()=>({kg:null,reps:null,rir:null,done:false})) })) };
  S.unlocked=new Set();
  render(); window.scrollTo(0,0);
  await saveActive();
}
function placeholderFor(e,si,rc,last){
  // innerhalb des Trainings: Gewicht des vorherigen Satzes übernehmen, sonst Empfehlung, sonst letztes Mal
  const prev=si>0?e.log[si-1]:null;
  const ls = last ? (last.sets[si]||last.sets[last.sets.length-1]) : null;
  const kg = prev&&prev.kg!=null ? prev.kg : (rc&&!rc.none ? rc.kg : (ls?ls.kg:null));
  const reps = rc&&!rc.none&&rc.repsNum ? rc.repsNum : (ls?ls.reps:(e.repMin||null));
  return {kg, reps};
}
function fillFromPlaceholder(ei,si){
  const a=S.active, e=a.entries[ei], s=e.log[si], last=lastFor(e.name,a.id);
  const ph=placeholderFor(e,si,recommendFor(e,a),last);
  if(s.kg==null && ph.kg!=null) s.kg=ph.kg;
  if(s.reps==null && ph.reps!=null) s.reps=ph.reps;
  if(s.rir==null) s.rir=num(String(e.rir).split('–')[0]);
}
function exComplete(e){ return !e.skipped && e.log.length>0 && e.log.every(s=>s.done); }
function scrollToEl(el){ if(!el) return; const y=el.getBoundingClientRect().top+window.scrollY-12; window.scrollTo({top:y, behavior:'smooth'}); }
function checkSet(ei,si){
  const a=S.active, e=a.entries[ei], s=e.log[si];
  let jump=false;
  if(!s.done){
    fillFromPlaceholder(ei,si);
    if(s.reps==null){ toast('Bitte Wiederholungen eintragen'); return; }
    s.done=true;
    if(e.ss){
      // Supersatz: erst nach dem letzten Partner dieser Runde pausieren
      const partners=a.entries.filter(x=>x.ss===e.ss && !x.skipped);
      const roundDone=partners.every(x=>!x.log[si] || x.log[si].done);
      if(roundDone) startTimer({...e, rest:SS_REST, ssRound:true});
      else { clearInterval(T.iv); $('#timer').classList.remove('show','over'); }
    } else startTimer(e);
    if(exComplete(e)){ if(S.unlocked) S.unlocked.delete(ei); jump=true; }
  } else s.done=false;
  scheduleSave(); render();
  if(jump){
    const open=i=>{ const x=a.entries[i]; return x && !x.skipped && !exComplete(x); };
    let next=-1;
    for(let i=ei+1;i<a.entries.length;i++) if(open(i)){ next=i; break; }
    if(next<0) for(let i=0;i<ei;i++) if(open(i)){ next=i; break; }
    requestAnimationFrame(()=>{
      if(next>=0) scrollToEl(document.getElementById('ex-'+next));
      else { scrollToEl(document.getElementById('finishBtn')); toast('Alle Übungen erledigt'); }
    });
  }
}
async function finishWorkout(){
  const a=S.active; if(!a) return;
  a.entries.forEach(e=>{ e.log=e.log.filter(s=>s.done); });
  a.status='done'; a.finishedAt=new Date().toISOString(); a.durationSec=elapsedSec(a); S.confirm=null;
  clearTimeout(scheduleSave._t);
  const doneSets=a.entries.reduce((n,e)=>n+e.log.filter(s=>s.done).length,0);
  const ok = await (async()=>{ S.saving=true; const d={...a, updatedAt:new Date().toISOString()}; delete d.id; const r=await dbWrite(()=>S.db.doc('workouts/'+a.id).set(d)); S.saving=false; return r; })();
  if(ok){ S.active=null; S.dirty=false; stopTimer(); toast('Training gespeichert · '+doneSets+' Sätze'); S.view='verlauf'; render(); window.scrollTo(0,0); }
}
async function cancelWorkout(){
  const a=S.active; if(!a) return; clearTimeout(scheduleSave._t); S.dirty=false;
  const id=a.id; S.active=null; S.confirm=null; stopTimer(); render();
  await dbWrite(()=>S.db.doc('workouts/'+id).delete());
}
async function saveBody(form,keys){
  const f=new FormData(form), date=f.get('date')||today();
  const d={}; keys.forEach(k=>{ const v=num(f.get(k)); if(v!=null) d[k]=v; });
  if(!Object.keys(d).length){ toast('Bitte einen Wert eintragen'); return; }
  const old=(S.body||[]).find(b=>b.date===date)||{}; const {id,...rest}=old;
  if(await dbWrite(()=>S.db.doc('body/'+date).set({...rest, date, ...d}))) toast('Gespeichert');
}
async function saveCalc(form){
  const f=new FormData(form), c={goal:f.get('goal')||'build', sex:f.get('sex')||'', age:num(f.get('age')), height:num(f.get('height')), weight:num(f.get('weight'))||latestWeight(), act:num(f.get('act'))};
  S.calc=c; render();
  if(!calcMacros(c)){ toast('Bitte alle Felder ausfüllen'); return; }
  await dbWrite(()=>S.db.doc('settings/calc').set(c));
}
function copyCsv(){
  const rows=[['Datum','Plan','Trainingstag','Übung','Satz','Gewicht (kg)','Wdh.','RIR','e1RM']];
  doneWorkouts().slice().reverse().forEach(w=>(w.entries||[]).forEach(e=>(e.log||[]).filter(s=>s.done).forEach((s,i)=>
    rows.push([w.date,w.planName,w.dayName,e.name,i+1,s.kg??'',s.reps??'',s.rir??'',s.kg&&s.reps?Math.round(e1rm(s.kg,s.reps)*10)/10:'']))));
  const csv=rows.map(r=>r.map(v=>{ v=String(v); return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\n');
  navigator.clipboard.writeText(csv).then(()=>toast('CSV kopiert ('+(rows.length-1)+' Sätze)')).catch(()=>toast('Kopieren nicht möglich'));
}

/* ---------------- Pausentimer ---------------- */
const T={end:0, iv:null, ctx:null, beeped:false};
function startTimer(e){
  try{ if(!T.ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) T.ctx=new AC(); } if(T.ctx&&T.ctx.state==='suspended') T.ctx.resume(); }catch(_){}
  T.end=Date.now()+(e.rest||90)*1000; T.beeped=false;
  $('#timerL').textContent = e.ss ? 'Pause · Supersatz '+e.ss+' – danach wieder '+e.ss+'a' : 'Pause · '+e.name;
  $('#timer').classList.add('show'); $('#timer').classList.remove('over');
  clearInterval(T.iv); T.iv=setInterval(tick,250); tick();
}
function tick(){
  const left=(T.end-Date.now())/1000;
  $('#timerT').textContent = left>=0 ? fmtTime(left) : '+'+fmtTime(-left);
  if(left<=0 && !T.beeped){ T.beeped=true; $('#timer').classList.add('over'); beep(); try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(_){} }
  if(left<-120) stopTimer();
}
function beep(){ try{ if(!T.ctx) return; const o=T.ctx.createOscillator(), g=T.ctx.createGain(); o.frequency.value=880; g.gain.value=0.15; o.connect(g); g.connect(T.ctx.destination); o.start(); o.stop(T.ctx.currentTime+0.35); }catch(_){} }
function stopTimer(){ clearInterval(T.iv); $('#timer').classList.remove('show','over'); }

/* ---------------- Events ---------------- */
document.addEventListener('click', ev=>{
  const tab=ev.target.closest('#tabs button');
  if(tab){ S.view=tab.dataset.view; S.confirm=null; render(); window.scrollTo(0,0); return; }
  const b=ev.target.closest('[data-action]'); if(!b) return;

  switch(act){
    case 'plan': if(S.db){ S.preview=null; S.settings.plan=b.dataset.id; render(); dbWrite(()=>S.db.doc('settings/app').set({...S.settings, plan:b.dataset.id})); } break;
    case 'preview': S.preview=b.dataset.day; render(); window.scrollTo(0,0); break;
    case 'week-prev': S.weekOff=Math.max(-8,(S.weekOff||0)-1); render(); break;
    case 'week-next': S.weekOff=Math.min(4,(S.weekOff||0)+1); render(); break;
    case 'adapt-apply': { const a=adaptiveTDEE(); if(a&&!a.need&&S.db){ const goal=(S.calc&&S.calc.goal)||'keep', m=macrosFrom(a.tdee*GOALS_C[goal][2], a.weight, goal);
      dbWrite(()=>S.db.doc('settings/nutrition').set({...m, source:'verbrauch', goal, updated:today()})).then(ok=>ok&&toast('Tagesziele angepasst: '+m.kcal+' kcal')); } break; }
    case 'cardio-pain': { const c=(S.cardio||[]).find(x=>x.id===b.dataset.id); if(c) dbWrite(()=>S.db.doc('cardio/'+c.id).update({pain:+b.dataset.v})).then(()=>toast('Gespeichert')); break; }
    case 'cardio-swell': { const c=(S.cardio||[]).find(x=>x.id===b.dataset.id); if(c) dbWrite(()=>S.db.doc('cardio/'+c.id).update({swell:b.dataset.v==='1'})).then(()=>toast('Gespeichert')); break; }
    case 'garmin-sync': { b.disabled=true; b.textContent='Lädt …'; GT.garmin().then(n=>{ toast(n?n+' neue Einheit(en)':'Keine neuen Einheiten'); return GT.pull(); }).catch(e=>toast('Garmin: '+(e.message||e))).finally(()=>render()); break; }
    case 'report-open': { S.reportId=b.dataset.id; S.view='bericht'; const rd=reportsRead(); if(!rd.includes(S.reportId)){ rd.push(S.reportId); try{ localStorage.setItem('gt-reports-read',JSON.stringify(rd)); }catch(e){} } render(); window.scrollTo(0,0); break; }
    case 'report-back': S.view='training'; render(); window.scrollTo(0,0); break;
    case 'sync-now': GT.pull(); toast('Wird abgeglichen …'); break;
    case 'sync-off': if(confirmTwice(b,'Wirklich trennen?')){ GT.disconnect(); render(); } break;
    case 'export': { const blob=new Blob([JSON.stringify(GT.exportAll())],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='gym-tracker-'+today()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); break; }
    case 'calc-apply': { const r=calcMacros(S.calc); if(r&&S.db) dbWrite(()=>S.db.doc('settings/nutrition').set({kcal:r.kcal, protein:r.protein, carbs:r.carbs, fat:r.fat, source:'rechner', goal:S.calc.goal, updated:today()})).then(ok=>ok&&toast('Tagesziele übernommen: '+r.kcal+' kcal · '+r.protein+' g Protein')); break; }
    case 'loc': { const v=b.dataset.loc==='home'?'home':'gym'; S.settings.location=v; render(); if(S.db) dbWrite(()=>S.db.doc('settings/app').set({...S.settings, location:v})); break; }
    case 'technik': S.techDay=b.dataset.day; S.view='technik'; render(); window.scrollTo(0,0); break;
    case 'tech-back': S.view='training'; render(); window.scrollTo(0,0); break;
    case 'preview-back': S.preview=null; render(); window.scrollTo(0,0); break;
    case 'start': S.preview=null; startWorkout(b.dataset.day); break;
    case 'check': checkSet(ei,si); break;
    case 'unlock': (S.unlocked=S.unlocked||new Set()).add(ei); render(); requestAnimationFrame(()=>scrollToEl(document.getElementById('ex-'+ei))); break;
    case 'addset': { const e=S.active.entries[ei]; e.log.push({kg:null,reps:null,rir:null,done:false}); scheduleSave(); render(); break; }
    case 'delset': { const e=S.active.entries[ei]; if(e.log.length>1){ e.log.pop(); scheduleSave(); render(); } break; }
    case 'finish': S.confirm='finish-top'; render(); break;
    case 'finish-bottom': S.confirm='finish-bottom'; render(); break;
    case 'finish-yes': finishWorkout(); break;
    case 'skip': S.confirm='skip:'+ei; render(); break;
    case 'skip-yes': { const e=S.active.entries[ei]; e.skipped=true; e.skipReason=b.dataset.r||''; e.log=e.log.filter(x=>x.done); if(!e.log.length) e.log=[]; S.confirm=null; scheduleSave(); render(); break; }
    case 'unskip': { const e=S.active.entries[ei]; e.skipped=false; e.skipReason=''; while(e.log.length<e.sets) e.log.push({kg:null,reps:null,rir:null,done:false}); scheduleSave(); render(); break; }
    case 'cancel': S.confirm='cancel'; render(); break;
    case 'cancel-yes': cancelWorkout(); break;
    case 'confirm-no': S.confirm=null; render(); break;
    case 'del': S.confirm='del:'+b.dataset.id; render(); break;
    case 'del-yes': { const id=b.dataset.id; S.confirm=null; dbWrite(()=>S.db.doc('workouts/'+id).delete()).then(ok=>ok&&toast('Gelöscht')); break; }
    case 'copycsv': copyCsv(); break;
    case 'timer-add': T.end+=15000; T.beeped=false; $('#timer').classList.remove('over'); tick(); break;
    case 'timer-stop': stopTimer(); break;
  }
});
document.addEventListener('input', ev=>{

document.addEventListener('change', ev=>{

document.addEventListener('submit', ev=>{

    const id='hand-'+Date.now().toString(36), d={id, source:'hand', date:f.get('date')||today(), type:'cycling', name:'Velo / Ergometer', min:m, avgHr:num(f.get('avgHr')), pain:num(f.get('pain'))};
    dbWrite(()=>S.db.doc('cardio/'+id).set(d)).then(()=>{ toast('Gespeichert'); ev.target.reset(); }); }
  if(ev.target.id==='cardioCfgForm'){ ev.preventDefault(); const f=new FormData(ev.target), c={}; ['sessions','startMin','maxMin','step','painMax'].forEach(k=>{ const v=num(f.get(k)); if(v!=null) c[k]=v; }); c.note=String(f.get('note')||'').trim();
    dbWrite(()=>S.db.doc('settings/cardio').set(c)).then(()=>toast('Vorgaben gespeichert')); }
  if(ev.target.id==='syncForm'){ ev.preventDefault(); const f=new FormData(ev.target); GT.connect(String(f.get('url')||''),String(f.get('token')||'')).then(()=>{ toast('Verbunden'); render(); }).catch(e=>toast('Verbindung fehlgeschlagen: '+(e.message||e))); }
  if(ev.target.id==='cycleForm'){ ev.preventDefault(); const v=new FormData(ev.target).get('start'); if(v&&S.db){ const st=mondayOf(String(v)); S.settings.cycleStart=st; render(); dbWrite(()=>S.db.doc('settings/app').set({...S.settings, cycleStart:st})).then(ok=>ok&&toast('Zyklus startet am '+fmtDate(st))); } }
});
let swX=null;
document.addEventListener('touchstart', e=>{ const w=e.target.closest&&e.target.closest('.wstrip'); swX=w?e.touches[0].clientX:null; }, {passive:true});
document.addEventListener('touchend', e=>{ if(swX==null) return; const dx=e.changedTouches[0].clientX-swX; swX=null; if(Math.abs(dx)<40) return; S.weekOff=Math.max(-8,Math.min(4,(S.weekOff||0)+(dx<0?1:-1))); render(); }, {passive:true});
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && S.dirty){ clearTimeout(scheduleSave._t); saveActive(); } });

<script>
/* ============================================================
   Ernährung
   products/<barcode>      { barcode, name, brand, per100:{kcal,protein,carbs,fat}, serving, source, updatedAt }
   pending/<barcode>       { barcode, label, firstScan, status: offen | nicht gefunden }
   nutrition/<YYYY-MM-DD>  { date, items:[{id, meal, barcode?, name, grams, kcal?, protein?, carbs?, fat?, addedAt}] }
   settings/nutrition      { kcal, protein, carbs, fat }
   Werte von Barcode-Einträgen werden immer aus products/ berechnet:
   sobald Claude einen offenen Barcode abgeglichen hat, stimmen auch die alten Einträge.
   ============================================================ */
const MEALS=['Frühstück','Mittagessen','Abendessen','Snacks'];
const MACROS=[['kcal','Kalorien','kcal'],['protein','Protein','g'],['carbs','Kohlenhydrate','g'],['fat','Fett','g']];
Object.assign(S,{dishes:[], sample:null, sampleImages:false, products:{}, pending:{}, nut:{}, nutGoals:{}, nutDate:today(), nutAdd:null, nutBusy:false});

function nutInit(db){
  if(S.nutInited) return; S.nutInited=true;
  db.collection('products').onSnapshot(s=>{ const p={}; s.docs.forEach(d=>p[d.id]=d.data()); S.products=p; if(S.view==='ernaehrung') softRender(); }, ()=>{});
  db.collection('pending').onSnapshot(s=>{ const p={}; s.docs.forEach(d=>p[d.id]=d.data()); S.pending=p; if(S.view==='ernaehrung') softRender(); }, ()=>{});
  db.collection('dishes').onSnapshot(s=>{ S.dishes=s.docs.map(d=>({id:d.id,...d.data()})); if(S.view==='ernaehrung') softRender(); }, ()=>{});
  S.sample=null; S.sampleImages=false;
  db.doc('settings/nutrition').onSnapshot(s=>{ S.nutGoals=s.exists?{...s.data()}:{}; if(S.view==='ernaehrung') softRender(); }, ()=>{});
  db.collection('nutrition').orderBy('date','desc').limit(120).onSnapshot(s=>{
    const n={}; s.docs.forEach(d=>n[d.id]=d.data()); S.nut=n;
    if(!s.metadata.fromCache){ S.nutLoaded=true; }
    if(S.view==='ernaehrung'||S.view==='koerper') softRender();
  }, ()=>{ S.nutLoaded=true; });
}

/* --- Berechnung --- */
async function deleteOwn(kind,id){
  if(kind==='dish'){ if(await dbWrite(()=>S.db.doc('dishes/'+id).delete())) toast('Gericht gelöscht'); return; }
  const p=S.products[id]; if(!p) return;
  // bereits erfasste Einträge behalten ihre Werte: Nährwerte fest in den Eintrag schreiben
  for(const d of Object.keys(S.nut)){
    const items=dayItems(d); if(!items.some(i=>i.barcode===id)) continue;
    const fixed=items.map(i=>{ if(i.barcode!==id) return i; const m=itemMacros(i)||{}; const {barcode,...rest}=i; const o={...rest, name:itemName(i)}; MACROS.forEach(([k])=>o[k]=Math.round((m[k]||0)*10)/10); return o; });
    if(!await dbWrite(()=>S.db.doc('nutrition/'+d).set({...S.nut[d], items:fixed}))) return;
  }
  if(await dbWrite(()=>S.db.doc('products/'+id).delete())){ delete S.products[id]; render(); toast('Produkt gelöscht – bisherige Einträge bleiben'); }
}
function itemMacros(it){
  if(it.barcode){
    const p=S.products[it.barcode]; if(!p||!p.per100) return null;
    const f=(it.grams||0)/100; const r={}; MACROS.forEach(([k])=>r[k]=(p.per100[k]||0)*f); return r;
  }
  const r={}; MACROS.forEach(([k])=>r[k]=it[k]||0); return r;
}
function itemName(it){ if(it.barcode){ const p=S.products[it.barcode]; if(p) return (p.name||'Produkt')+(p.brand?' · '+p.brand:''); return it.name||('Barcode '+it.barcode); } return it.name||'Eintrag'; }
function dayItems(date){ return (S.nut[date]&&S.nut[date].items)||[]; }
function dayTotals(date){
  const t={kcal:0,protein:0,carbs:0,fat:0}; let open=0;
  dayItems(date).forEach(it=>{ const m=itemMacros(it); if(!m){open++;return;} MACROS.forEach(([k])=>t[k]+=m[k]); });
  return {t,open};
}
const r0=n=>Math.round(n||0);
function shiftDate(iso,d){ const [y,m,dd]=iso.split('-').map(Number); const x=new Date(y,m-1,dd+d); return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()); }

/* --- Speichern (ein Schreibvorgang pro Tag gleichzeitig) --- */
const nutQueue={};
function saveDay(date, mutate){
  const cur=S.nut[date]?JSON.parse(JSON.stringify(S.nut[date])):{date,items:[]};
  mutate(cur); S.nut[date]=cur; render();
  const prev=nutQueue[date]||Promise.resolve();
  nutQueue[date]=prev.then(()=>dbWrite(()=>S.db.doc('nutrition/'+date).set(S.nut[date])));
  return nutQueue[date];

/* --- Barcode aus Foto lesen --- */
async function decodeBarcode(file){
  /* liefert {code} oder {why: 'image'|'lib'|'notfound'} */
  const url=URL.createObjectURL(file);
  try{
    let img;
    try{ img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; }); }
    catch(_){ return {why:'image'}; }
    if('BarcodeDetector' in window){
      try{ const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}); const r=await det.detect(img); if(r&&r[0]) return {code:r[0].rawValue}; }catch(_){}
    }
    try{ await loadZXing(); }catch(_){ return {why:'lib'}; }
    const Z=window.ZXing, hints=new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
    hints.set(Z.DecodeHintType.TRY_HARDER,true);
    if(Z.BrowserMultiFormatReader){
      try{ const br=new Z.BrowserMultiFormatReader(hints); const r=await br.decodeFromImageElement(img); if(r) return {code:r.getText()}; }catch(_){}
    }
    const reader=new Z.MultiFormatReader(); reader.setHints(hints);
    const W=img.naturalWidth, H=img.naturalHeight;
    const crops=[[0,0,1,1],[0,0.25,1,0.5],[0.1,0.1,0.8,0.8],[0,0.35,1,0.3]];
    for(const maxW of [1000,1600,700,2200]){
      for(const [cx,cy,cw,ch] of crops){
        for(const rot of [0,90]){
          const sw=W*cw, sh=H*ch, sc=Math.min(1,maxW/Math.max(sw,sh)), w=Math.max(1,Math.round(sw*sc)), h=Math.max(1,Math.round(sh*sc));
          const c=document.createElement('canvas'); c.width=rot?h:w; c.height=rot?w:h;
          const ctx=c.getContext('2d',{willReadFrequently:true}); if(rot){ ctx.translate(h,0); ctx.rotate(Math.PI/2); }
          ctx.drawImage(img, W*cx, H*cy, sw, sh, 0, 0, w, h);
          const srcs=[];
          if(Z.HTMLCanvasElementLuminanceSource){ try{ srcs.push(new Z.HTMLCanvasElementLuminanceSource(c)); }catch(_){} }
          if(Z.RGBLuminanceSource){ try{ const d=ctx.getImageData(0,0,c.width,c.height).data, lum=new Uint8ClampedArray(c.width*c.height);
            for(let i=0,j=0;i<d.length;i+=4,j++) lum[j]=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;
            srcs.push(new Z.RGBLuminanceSource(lum,c.width,c.height)); }catch(_){} }
          for(const src of srcs){
            for(const Bin of [Z.HybridBinarizer,Z.GlobalHistogramBinarizer]){
              if(!Bin) continue;
              try{ const r=reader.decode(new Z.BinaryBitmap(new Bin(src))); if(r) return {code:r.getText()}; }catch(_){}
            }
          }
        }
      }
    }
    return {why:'notfound'};
  } finally { URL.revokeObjectURL(url); }
}

function proteinSuggestions(missP, kcalLeft){
  const own=Object.values(S.products).filter(p=>p.per100&&p.per100.protein>=15&&p.per100.kcal&&p.per100.protein*4/p.per100.kcal>=0.25)
    .map(p=>({name:(p.name||'Produkt')+(p.brand?' · '+p.brand:''), per100:p.per100, portion:p.serving||100, unit:p.serving?'1 Portion':'100 g', barcode:p.barcode, own:true}));
  const all=[...own, ...PROTEIN_FOODS].map(f=>{
    const g=Math.min(Math.max(f.portion*0.5, missP/f.per100.protein*100), f.portion);
    const grams=g<60?Math.round(g/5)*5:Math.round(g/10)*10, fac=grams/100;
    const m={}; MACROS.forEach(([k])=>m[k]=(f.per100[k]||0)*fac);
    return {...f, grams, m, density:f.per100.protein/Math.max(1,f.per100.kcal)};
  });
  // eigene Produkte zuerst, dann nach Protein pro kcal; was das Kalorienbudget klar sprengt, nach hinten
  all.sort((a,b)=>(b.own-a.own) || ((kcalLeft!=null && (a.m.kcal>kcalLeft+100)) - (kcalLeft!=null && (b.m.kcal>kcalLeft+100))) || b.density-a.density);
  return all.slice(0,6);
}

function viewProteinFill(date,t,g){
  if(!g.protein) return '';
  const miss=g.protein-t.protein; if(miss<=5) return '<div class="card"><b>'+I('checkc')+' Proteinziel erreicht.</b></div>';
  const kcalLeft=g.kcal?g.kcal-t.kcal:null, meals=openMeals(date);
  let h='<div class="card"><details class="fill-det"'+(S.fillOpen?' open':'')+'><summary><b>Protein auffüllen – noch '+r0(miss)+' g</b></summary>';
  if(!meals.length){ h+='<p class="small muted" style="margin:8px 0 0">Alle Mahlzeiten sind erfasst. Für den Rest eignet sich ein Snack, z. B. Magerquark oder ein Proteinshake – über «Snacks» eintragen.</p></details></div>'; S._fillSug=[]; return h; }
  // Verteilung: Hauptmahlzeiten zählen doppelt, Snacks einfach
  const w=m=>m==='Snacks'?1:2, W=meals.reduce((a,m)=>a+w(m),0), sug=[];

    const best=pool.map(d=>({...d, s:Math.abs(d.p-tp)+(tk!=null&&d.k>tk+100?(d.k-tk)/10:0)})).sort((a,b)=>a.s-b.s).slice(0,2);
